[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sphura-engine"
version = "0.1.0"
description = "Processing engine for SPHURA: long gameplay -> AI-selected vertical shorts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
sphura = "sphura.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sphura"]

[tool.hatch.build.targets.wheel.force-include]
"src/sphura/infrastructure/persistence/sqlite/migrations" = "sphura/infrastructure/persistence/sqlite/migrations"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sphura"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "onnxruntime.*"]
ignore_missing_imports = true
