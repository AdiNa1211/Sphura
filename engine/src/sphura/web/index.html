<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPHURA</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --panel2: #1d2029; --line: #2a2e3a;
    --text: #e9ebf1; --muted: #8b91a1; --accent: #ff5a36; --accent2: #ffb020;
    --good: #2ecc71; --bad: #ff4d5e; --blue: #4aa3ff; --radius: 12px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--text); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
           color: var(--text); border-radius: 8px; padding: 7px 12px; }
  button:hover:not(:disabled) { border-color: #3c4252; background: #232734; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #ff6d4d; }
  button.ghost { background: transparent; }
  input[type=text], input[type=number], input[type=password] { font: inherit; color: var(--text); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input:focus { outline: 2px solid #3c4252; }
  a { color: var(--blue); }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: .3px; }
  .logo span { color: var(--accent); }
  .pills { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--panel2);
          border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ok::before, .pill.warn::before { content: ""; display: inline-block; width: 7px; height: 7px;
          border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .pill.ok::before { background: var(--good); } .pill.warn::before { background: var(--accent2); }

  .layout { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); padding: 16px; background: var(--panel); }
  aside h3 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .proj { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .proj:hover { background: var(--panel2); }
  .proj.active { background: var(--panel2); border-color: var(--line); }
  .proj .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .meta { font-size: 12px; color: var(--muted); }
  main { padding: 22px 28px 60px; max-width: 1400px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin-bottom: 18px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .err { color: var(--bad); white-space: pre-wrap; }

  .rec { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 8px; background: var(--panel2); }
  .rec .name { font-weight: 600; word-break: break-all; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .b-obs { background: #2a2140; color: #b99bff; }
  .b-top { background: #3a2410; color: var(--accent2); } .b-strong { background: #10283a; color: var(--blue); }
  .b-maybe { background: #24262e; color: var(--muted); }
  .b-meme { background: #f2f2f2; color: #111; } .b-cinematic { background: #222; color: #ddd; border: 1px solid #444; }
  .b-hype { background: #3a1410; color: var(--accent); }

  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 6px; }
  .stage { padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; }
  .stage .bar { height: 4px; border-radius: 4px; background: #2a2e3a; margin-top: 6px; overflow: hidden; }
  .stage .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .stage.done .bar i { background: var(--good); width: 100%; }
  .stage.done { color: var(--good); }
  .overall { height: 6px; border-radius: 6px; background: #2a2e3a; overflow: hidden; }
  .overall i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 8px 0 16px; }
  .tab { padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .moment { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .moment.rejected { opacity: .5; }
  .thumb { aspect-ratio: 16/9; background: #000 center/cover no-repeat; position: relative; }
  .thumb .rank { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.75); padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .thumb .when { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.75); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .moment .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .moment .title { font-weight: 700; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 11px; color: var(--muted); background: var(--panel2); padding: 1px 7px; border-radius: 5px; }
  .vote { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
  .vote button { padding: 5px 10px; }
  .vote button.on-good { border-color: var(--good); color: var(--good); }
  .vote button.on-bad { border-color: var(--bad); color: var(--bad); }

  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 14px; }
  .style { border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; background: var(--panel2); }
  .style.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .style b { display: block; margin-bottom: 3px; }

  .shorts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .short { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .short video { width: 100%; display: block; background: #000; max-height: 460px; }
  .short .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .copyrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .copyrow button { font-size: 12px; padding: 4px 9px; }
  .edit { display: flex; flex-direction: column; gap: 5px; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
  .edit input, .edit textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .ontext { background: var(--panel2); padding: 1px 6px; border-radius: 5px; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip { border-radius: 99px; padding: 6px 14px; }
  .chip span { color: var(--muted); margin-left: 4px; font-size: 12px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.on span { color: rgba(255,255,255,.8); }
  .aibox { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .libbtn { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); color: var(--text); text-decoration: none; flex: 1; min-width: 200px; }
  .libbtn:hover { border-color: #3c4252; }
  .b-bad { background: #3a1018; color: var(--bad); }
  .b-lic { background: #12301f; color: var(--good); } .b-warn { background: #3a2a10; color: var(--accent2); }
  .musicrow { display: flex; align-items: center; gap: 8px; }
  .musicrow button { padding: 2px 8px; font-size: 12px; }
  select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .drop { margin-top: 12px; border: 2px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .empty { text-align: center; padding: 40px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
  .rlsteps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 12px 0 16px; }
  .rlstep { padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .rlstep b { display: block; font-size: 11px; opacity: .8; }
  .rlstep.on { border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 1px var(--accent) inset; }
  .rlstep.done { color: var(--good); } .rlstep.click { cursor: pointer; } .rlstep.click:hover { border-color: #3c4252; }
  .rldrop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; color: var(--muted); }
  .rldrop.over { border-color: var(--accent); color: var(--text); background: rgba(255,90,54,.06); }
  table.rlq { width: 100%; border-collapse: collapse; }
  .rlq td, .rlq th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: middle; }
  .rlq th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .rlq td.num { white-space: nowrap; }
  .rlq button { padding: 3px 8px; font-size: 12px; }
  .rlbar { height: 6px; border-radius: 6px; background: #2a2e3a; overflow: hidden; min-width: 120px; }
  .rlbar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .rlbar.ok i { background: var(--good); }
  .rlm { display: grid; grid-template-columns: 210px 1fr 170px; gap: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: var(--panel); }
  .rlm.off { opacity: .55; } .rlm.dup { opacity: .4; }
  .rlm .th { aspect-ratio: 16/9; background: #000 center/cover no-repeat; border-radius: 8px; position: relative; cursor: pointer; }
  .rlm .th span { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.75); padding: 1px 6px; border-radius: 5px; font-size: 11px; }
  .rlm .th::after { content: "▶"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; opacity: 0; transition: opacity .2s; }
  .rlm .th:hover::after { opacity: .9; }
  .rlm input[type=number] { width: 74px; padding: 4px 6px; }
  .score { font-weight: 800; font-size: 22px; line-height: 1; } .score small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .rlseq { display: grid; grid-template-columns: 34px 120px 1fr auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--panel); }
  .rlseq .th { aspect-ratio: 16/9; background: #000 center/cover no-repeat; border-radius: 6px; cursor: pointer; }
  .rlseq .n { font-weight: 800; font-size: 18px; text-align: center; color: var(--muted); }
  .rlseq input[type=number] { width: 70px; padding: 3px 6px; }
  .rlseq button { padding: 3px 8px; font-size: 12px; }
  .rlgrid2 { display: grid; grid-template-columns: 1fr 380px; gap: 16px; align-items: start; }
  .rlopt label { display: block; margin: 6px 0; font-size: 13px; }
  .rlopt select, .rlopt input[type=text] { width: 100%; }
  .rlpresets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 6px; }
  .rlpresets div { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; cursor: pointer; font-size: 12px; background: var(--panel2); }
  .rlpresets div.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .rlpresets b { display: block; font-size: 13px; }
  .rlmodal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .rlmodal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; width: min(920px, 92vw); }
  .rlmodal video, .rlplayer video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; display: block; }
  .rlout { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 16px; align-items: start; }
  .rlout textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222633;
           border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
  textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; resize: vertical; }
  #edinspector { max-height: calc(min(62vh, 760px) + 56px); overflow-y: auto; }
  .edgrid { display: grid; grid-template-columns: minmax(280px, 1fr) 340px; gap: 14px; align-items: start; }
  .edstage { display: flex; flex-direction: column; align-items: center; }
  .edframe { position: relative; height: min(62vh, 760px); max-width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
  .edframe video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .edtext { position: absolute; inset: 0; pointer-events: none; }
  .edov { position: absolute; left: 4%; right: 4%; transform: translateY(-50%); text-align: center; pointer-events: auto; cursor: ns-resize; line-height: 1.15;
    font-family: "Arial Black", Arial, sans-serif; font-weight: 900; -webkit-text-stroke: 0.04em #000; paint-order: stroke fill; }
  .edov.ed-plain { font-family: Arial, sans-serif; font-weight: 700; }
  .edov.ed-bar { -webkit-text-stroke: 0; font-family: Arial, sans-serif; font-weight: 700; }
  .edov.on { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .edsz { position: absolute; right: -12px; bottom: -12px; width: 14px; height: 14px; background: var(--accent); border: 2px solid #fff; border-radius: 3px; cursor: nwse-resize; }
  .edtl { overflow-x: auto; position: relative; padding-bottom: 6px; }
  .edinner { position: relative; padding-left: 0; }
  .edruler { position: relative; height: 22px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .edruler span { position: absolute; top: 3px; font-size: 11px; color: var(--muted); transform: translateX(2px); }
  .edtrack { position: relative; margin-top: 18px; border-radius: 6px; background: #151821; }
  .edlab { position: absolute; left: 2px; top: -15px; font-size: 10px; color: var(--muted); z-index: 0; }
  .edblk { position: absolute; top: 4px; height: 26px; border-radius: 5px; font-size: 12px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; cursor: grab; user-select: none; }
  .edblk span { padding: 0 10px; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .edblk.seg { background: #2b3550; border: 1px solid #3d4a70; height: 40px; }
  .edfilm { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .edfilm img { position: absolute; top: 0; height: 100%; object-fit: cover; opacity: .9; }
  .edblk.seg span { position: relative; z-index: 1; margin-left: 12px; padding: 1px 6px; background: rgba(0,0,0,.6); border-radius: 4px; font-size: 11px; }
  .edblk.seg.on { border: 2px solid #fff; box-shadow: none; }
  .edblk.seg.on .h { background: #fff; background-image: linear-gradient(90deg, transparent 4px, #333 4px, #333 6px, transparent 6px); width: 12px; }
  .edframe.live video#edvid { object-fit: cover; }
  .edlive { position: absolute; left: 8px; top: 8px; z-index: 3; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; pointer-events: none; }
  .edtrimv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 4; }
  .edtrimlab { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; background: rgba(0,0,0,.75); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
  .edblk.teaser { background: #3a2410; color: var(--accent2); border: 1px dashed #6a4520; padding-left: 6px; cursor: default; }
  .edblk.txt { height: 22px; background: #3a1f4a; border: 1px solid #6b3d87; }
  .edblk.aud { background: #12302a; border: 1px solid #1f5246; color: #3ddc97; }
  .edblk.aud.tz { border-style: dashed; cursor: default; opacity: .8; }
  .edblk.mus { background: #241f3c; border: 1px solid #463b72; color: #a78bfa; cursor: pointer; }
  .edblk.aud span, .edblk.mus span { position: relative; z-index: 1; color: var(--text); text-shadow: 0 1px 2px #000; }
  .edwave { position: absolute; left: 0; top: 2px; width: 100%; height: calc(100% - 4px); pointer-events: none; }
  .edwave polygon { fill: currentColor; opacity: .5; }
  .edbeat { position: absolute; bottom: 0; width: 1px; height: 7px; background: rgba(255,255,255,.4); pointer-events: none; }
  .eddip { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.5); pointer-events: none; }
  .ednone { position: absolute; left: 10px; top: 10px; font-size: 12px; color: var(--muted); }
  .edblk.mom { height: 22px; background: #2e2913; border: 1px solid #6d5d1f; color: #f5d76e; cursor: pointer; }
  .edblk.mom.in { opacity: .45; }
  .edblk.pick { background: rgba(255,106,61,.2); border: 1px dashed var(--accent); pointer-events: none; z-index: 2; }
  .edblk.seg.src { background: rgba(255,106,61,.35); border-color: var(--accent); }
  .edblk.seg.src span { padding: 0 4px; }
  .edmodes { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .edmodes button { border: 0; border-radius: 0; background: transparent; padding: 7px 14px; }
  .edmodes button.on { background: var(--accent); color: #fff; }
  .edbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; width: 100%; }
  .edbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .edbar kbd { font-size: 10px; opacity: .6; margin-left: 4px; }
  .edbar .note { font-size: 12px; color: var(--muted); }
  .edhelp { margin: 6px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.45; }
  .edhelp li { margin-bottom: 8px; }
  .edmark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #ffd34d; pointer-events: none; z-index: 2; }
  .edmark::after { position: absolute; top: -14px; left: -4px; font-size: 10px; color: #ffd34d; content: attr(data-l); }
  .edblk.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .edblk .h { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: rgba(255,255,255,.18);
    background-image: linear-gradient(90deg, transparent 3px, rgba(255,255,255,.55) 3px, rgba(255,255,255,.55) 4px, transparent 4px, transparent 6px, rgba(255,255,255,.55) 6px, rgba(255,255,255,.55) 7px, transparent 7px); }
  .edblk .h:hover { background-color: var(--accent); }
  .edblk .h.l { left: 0; } .edblk .h.r { right: 0; }
  .edph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; z-index: 3; }
  .edphh { position: absolute; top: 0; left: -7px; width: 16px; height: 20px; pointer-events: auto; cursor: ew-resize; background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); }
  .edruler, .edtrack { cursor: ew-resize; }
  .edtrack .edblk { cursor: grab; } .edtrack .edblk.tz { cursor: default; } .edtrack .edblk.mus { cursor: pointer; }
  body.edscrub, body.edscrub * { cursor: ew-resize !important; user-select: none; }
  .edrow { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .edrow label { width: 64px; font-size: 13px; color: var(--muted); }
  .edrow input[type=number] { width: 72px; }
  @media (max-width: 1100px) { .edgrid { grid-template-columns: 1fr; } }
  .si-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .si-stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .si-stat b { display: block; font-size: 24px; margin-top: 2px; }
  .si-row { display: grid; grid-template-columns: 112px 1fr 300px 70px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .si-row img { width: 112px; height: 63px; object-fit: cover; border-radius: 6px; background: #000; }
  .si-row a { color: var(--text); text-decoration: none; font-weight: 600; } .si-row a:hover { color: var(--accent); }
  .si-m { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; font-size: 12px; color: var(--muted); }
  .si-m b { color: var(--text); font-weight: 600; }
  .si-ops { text-align: center; font-size: 22px; font-weight: 800; }
  .si-ops small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .05em; }
  .b-viral { background: #3a1410; color: var(--accent); } .b-trending { background: #10283a; color: var(--blue); }
  .b-small_creator { background: #12301f; color: var(--good); } .b-consistent { background: #3a2410; color: var(--accent2); }

  @media (max-width: 1100px) { .si-row { grid-template-columns: 90px 1fr 70px; } .si-row .si-m { grid-column: 2 / 4; } .si-row img { width: 90px; height: 51px; } }
</style>
</head>
<body>
<header>
  <div class="logo">SPHU<span>RA</span></div>
  <div class="pills" id="pills"></div>
</header>
<div class="layout">
  <aside>
    <button class="primary" style="width:100%" onclick="showNew()">+ New stream</button>
    <button style="width:100%; margin-top:8px" onclick="showDownloads('queue')">⬇ Downloads</button>
    <button style="width:100%; margin-top:8px" onclick="showMusic()">♪ Music</button>
    <button style="width:100%; margin-top:8px" onclick="showReels()" title="Turn many clips into one edited highlight video">★ Highlight reel</button>
    <button style="width:100%; margin-top:8px" onclick="showIntel()" title="What makes gaming Shorts work, from public YouTube data">📈 Shorts Intelligence</button>
    <h3>Your streams</h3>
    <div id="projects"><div class="muted small">Loading…</div></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const STAGES = [
  ["extract_audio", "Audio"], ["transcribe", "Speech"], ["signals", "Action"],
  ["judge", "AI judging"], ["compare", "Ranking"],
];
const STYLE_INFO = {
  meme: ["Meme caption", "~20 s, white caption bar: setup, then the punchline. 3:4"],
  cinematic: ["Cinematic edit", "~20 s, dark grade, glitch cuts, music on the beat. Square"],
  hype: ["Hype edit", "Cold open, zooms, shake, slow-mo, sound effects. 9:16"],
};
let state = { styleFilter: localStorage.getItem("cf_style_filter") || "all", project: null, tab: location.hash === "#shorts" ? "shorts" : "moments", timer: null, styles: new Set(["meme", "cinematic"]) };

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function hms(t) { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }
function size(b) { return b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB"; }
function ago(sec) { const d = (Date.now() / 1000 - sec); if (d < 3600) return Math.max(1, Math.round(d / 60)) + " min ago";
  if (d < 86400) return Math.round(d / 3600) + " h ago"; return Math.round(d / 86400) + " days ago"; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
}

async function loadStatus() {
  try {
    const s = await api("/v1/system/status");
    const pills = [];
    pills.push(s.ai.problem ? `<span class="pill warn" title="${esc(s.ai.problem)}">AI judge: off</span>`
                            : `<span class="pill ok">AI: ${esc(s.ai.name)}${s.ai.local ? " (local)" : ""}</span>`);
    pills.push(`<span class="pill ok" style="cursor:pointer" onclick="showMusic()" title="SPHURA makes original music for each Short">Music: ${s.music.ai ? "AI music" : "SPHURA scores"}${s.music.tracks ? ` + ${s.music.tracks} track${s.music.tracks > 1 ? "s" : ""}` : ""}</span>`);
    if (s.encoders.length) pills.push(`<span class="pill ok">Encoder: ${esc(s.encoders[0].replace("h264_", "").toUpperCase())}</span>`);
    $("#pills").innerHTML = pills.join("");
  } catch (e) { $("#pills").innerHTML = `<span class="pill warn">${esc(e.message)}</span>`; }
}

async function loadProjects() {
  const hidden = new Set(await api("/v1/reels/hidden-projects").catch(() => []));
  const ps = (await api("/v1/projects")).filter(p => !hidden.has(p.id)); // reel sources stay in their reel
  $("#projects").innerHTML = ps.length ? ps.map(p => `
    <div class="proj ${state.project?.id === p.id ? "active" : ""}" onclick="openProject('${p.id}')">
      <div class="name" title="${esc(p.name)}">${esc(p.name)}</div>
      <div class="meta">${new Date(p.created_at).toLocaleDateString()}</div>
    </div>`).join("") : `<div class="muted small">No streams yet.</div>`;
  return ps;
}

// ---------- New stream ----------
async function showNew() {
  if (!edLeaveOk()) return;
  rlStop();
  leaveDownloads();
  stopPolling(); state.project = null; loadProjects();
  $("#main").innerHTML = `
    <h1>New stream</h1>
    <div class="sub">Pick a recording. SPHURA finds the best moments, then you choose how to cut them.</div>
    <div class="card">
      <h2>Paste a file path</h2>
      <div class="row"><input type="text" id="path" class="grow" placeholder='D:\\stream\\my recording.mp4'>
        <button class="ghost" onclick="browseVideo(this)">Browse…</button>
        <button class="primary" onclick="processPath($('#path').value.trim().replace(/^\\"|\\"$/g, ''))">Process</button></div>
    </div>
    <div class="card row">
      <div class="grow"><h2 style="margin:0">Or use a YouTube video or playlist</h2>
        <div class="small muted">Download it in Downloads, then click Edit video.</div></div>
      <button class="primary" onclick="showDownloads('queue')">Open Downloads</button>
    </div>
    <div class="card">
      <h2>Recent recordings</h2>
      <div id="recent"><span class="spin"></span> <span class="muted">Looking in your OBS folder, Videos, Downloads and other drives…</span></div>
    </div>`;
  try {
    const vids = await api("/v1/library/recent");
    $("#recent").innerHTML = vids.length ? vids.map(v => `
      <div class="rec">
        <div class="grow"><div class="name">${esc(v.name)} ${v.from_obs ? '<span class="badge b-obs">OBS</span>' : ""}</div>
          <div class="small muted">${esc(v.folder)} · ${size(v.size_bytes)} · ${ago(v.modified)}</div></div>
        <button class="primary" data-path="${esc(v.path)}" onclick="processPath(this.dataset.path)">Process</button>
      </div>`).join("") : `<div class="muted">No recordings found. Paste a path or use Browse above.</div>`;
  } catch (e) { $("#recent").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function browseVideo(btn) {
  btn.disabled = true;
  try { const r = await api("/v1/library/choose-file", { method: "POST" }); if (r.path) $("#path").value = r.path; }
  catch (e) { toast(e.message); }
  finally { btn.disabled = false; }
}

async function processPath(path) {
  if (!path) return toast("Enter a file path first");
  try {
    toast("Registering the recording…");
    const r = await api("/v1/ingest", { method: "POST", body: { path } });
    await api(`/v1/projects/${r.project.id}/analyze`, { method: "POST", body: {} });
    await loadProjects();
    openProject(r.project.id);
  } catch (e) { toast("Error: " + e.message); }
}

// ---------- Downloads ----------
const ED = { not_edited: ["Not edited", "b-maybe"], analysing: ["Analysing", "b-strong"], analysed: ["Ready for Shorts", "b-top"],
  shorts: ["Shorts made", "b-lic"], analysis_failed: ["Analysis failed", "b-warn"] };
const DST = { queued: ["Queued", "b-maybe"], downloading: ["Downloading", "b-strong"], paused: ["Paused", "b-warn"],
  failed: ["Failed", "b-bad"], cancelled: ["Cancelled", "b-maybe"] };
const QLABEL = { best: "Best available", 2160: "2160p (4K)", 1440: "1440p", 1080: "1080p", 720: "720p", 480: "480p" };
const FNAMES = { title_id: "Title [video id]", title: "Title", channel_title: "Channel - Title", date_title: "Date Title" };
function hms(s) { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; }
function speed(b) { return b ? (b > 1e6 ? (b / 1e6).toFixed(1) + " MB/s" : (b / 1e3).toFixed(0) + " KB/s") : ""; }
function eta(s) { if (s == null) return ""; s = Math.round(s); return s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min left` : s >= 60 ? `${Math.floor(s / 60)} min ${s % 60} s left` : `${s} s left`; }
function res(d) { return d.height ? `${d.height}p${d.fps > 31 ? Math.round(d.fps) : ""}` : ""; }
function dlThumb(d) { return d.thumbnail_path || d.thumbnail_url ? `/v1/downloads/${d.id}/thumb.jpg` : ""; }

async function showDownloads(tab) {
  if (!edLeaveOk()) return;
  rlStop();
  stopPolling(); state.project = null; loadProjects();
  state.dl = { tab: tab || state.dl?.tab || "queue", sig: {}, playing: null, confirm: null, data: null };
  history.replaceState(null, "", state.dl.tab === "library" ? "#downloads/library" : "#downloads");
  $("#main").innerHTML = `<div class="row"><h1 class="grow">Downloads</h1><button onclick="dlToggleSettings()">⚙ Settings</button></div>
    <div class="sub">Download your YouTube videos and playlists, then turn them into Shorts. Only download videos you own or have permission to use.</div>
    <div id="dlsetup"></div><div id="dlsettings" hidden></div>
    <div class="tabs"><div class="tab" id="t-queue" onclick="dlTab('queue')">Download queue</div>
      <div class="tab" id="t-library" onclick="dlTab('library')">Downloaded videos</div></div>
    <div id="dl-queue">
      <div class="card"><h2>Add from YouTube</h2>
        <div class="row"><label class="small muted" style="width:90px">Video link</label><input type="text" id="dlvideo" class="grow" placeholder="https://www.youtube.com/watch?v=…" onkeydown="if(event.key==='Enter')dlPreview(false)">
          <button class="primary" onclick="dlPreview(false)">Continue</button></div>
        <div class="row" style="margin-top:8px"><label class="small muted" style="width:90px">Playlist link</label><input type="text" id="dlplaylist" class="grow" placeholder="https://www.youtube.com/playlist?list=…" onkeydown="if(event.key==='Enter')dlPreview(true)">
          <button class="primary" onclick="dlPreview(true)">Continue</button></div>
        <div id="dlpreview"></div></div>
      <div id="dlqueue"></div></div>
    <div id="dl-library" hidden>
      <div class="card row">
        <input type="text" id="dlsearch" class="grow" placeholder="Search by title" oninput="dlRenderLibrary(true)">
        <select id="dlsort" style="width:auto" onchange="dlRenderLibrary(true)">
          <option value="date_desc">Newest first</option><option value="date_asc">Oldest first</option>
          <option value="dur_desc">Longest</option><option value="dur_asc">Shortest</option>
          <option value="size_desc">Largest</option><option value="size_asc">Smallest</option></select>
        <select id="dlfilter" style="width:auto" onchange="dlRenderLibrary(true)"><option value="">All videos</option>
          ${Object.entries(ED).map(([k, [l]]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
      <div id="dllibrary"></div></div>`;
  dlTab(state.dl.tab);
  dlPoll();
}

function dlTab(t) {
  state.dl.tab = t;
  history.replaceState(null, "", t === "library" ? "#downloads/library" : "#downloads");
  $("#t-queue").classList.toggle("active", t === "queue"); $("#t-library").classList.toggle("active", t === "library");
  $("#dl-queue").hidden = t !== "queue"; $("#dl-library").hidden = t !== "library";
}

async function dlPoll() {
  if (!state.dl || !$("#dlqueue")) return;
  try {
    const data = await api("/v1/downloads"); state.dl.data = data;
    dlRenderSetup(data);
    const queue = data.items.filter(d => d.status !== "completed"), lib = data.items.filter(d => d.status === "completed");
    $("#t-queue").innerHTML = `Download queue${queue.length ? ` <span class="muted">${queue.length}</span>` : ""}`;
    $("#t-library").innerHTML = `Downloaded videos${lib.length ? ` <span class="muted">${lib.length}</span>` : ""}`;
    dlRenderQueue(queue); dlRenderLibrary(false);
    if (!$("#dlsettings").hidden && !$("#dlsettings").innerHTML) dlRenderSettings();
    const busy = queue.some(d => d.status === "downloading" || d.status === "queued") || data.setup.running
      || lib.some(d => d.editing === "analysing");
    state.timer = setTimeout(dlPoll, busy ? 1000 : 4000);
  } catch (e) { $("#dlqueue").innerHTML = `<div class="card err">${esc(e.message)}</div>`; state.timer = setTimeout(dlPoll, 4000); }
}

function dlRenderSetup(data) {
  const el = $("#dlsetup");
  if (data.ready) { el.innerHTML = ""; return; }
  const s = data.setup;
  el.innerHTML = `<div class="card">${s.running ? ytBar(s.step, s.progress) : `<div class="row"><div class="grow"><b>One-time setup</b>
    <div class="small muted">SPHURA downloads the official yt-dlp and Deno (about 65 MB) into its own folder. Nothing is installed on your system.</div>
    ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}</div><button class="primary" onclick="dlTools()">Turn on YouTube downloads</button></div>`}</div>`;
}
function ytBar(step, p) { return `<div class="small muted" style="margin-bottom:6px">${esc(step)} · ${Math.round(p * 100)}%</div><div class="overall"><i style="width:${p * 100}%"></i></div>`; }
async function dlTools() { try { await api("/v1/downloads/tools", { method: "POST" }); stopPolling(); dlPoll(); } catch (e) { toast(e.message); } }

// --- import preview ---
async function dlPreview(playlist) {
  const url = $(playlist ? "#dlplaylist" : "#dlvideo").value.trim();
  if (!url) return toast(playlist ? "Paste a playlist link first" : "Paste a video link first");
  const box = $("#dlpreview");
  box.innerHTML = `<div style="margin-top:12px"><span class="spin"></span> <span class="muted">Reading ${playlist ? "the playlist" : "the video's details"} from YouTube…</span></div>`;
  try {
    const v = await api("/v1/downloads/preview", { method: "POST", body: { url, playlist } });
    state.dl.preview = v;
    v.kind === "playlist" ? dlRenderPlaylist(v) : dlRenderVideo(v);
  } catch (e) { box.innerHTML = `<div class="err" style="margin-top:10px">${esc(e.message)}</div>`; }
}

function dlQualitySelect(v) {
  const def = state.dl.data?.settings.quality || "best";
  if (v && v.qualities) {
    const top = v.qualities[0], opt = q => `${q.label}${q.size_bytes ? " · about " + size(q.size_bytes) : ""}`;
    return `<select id="dlq"><option value="best">Best available${top ? ` (${esc(opt(top))})` : ""}</option>
      ${v.qualities.map(q => `<option value="${q.value}" ${q.value === def ? "selected" : ""}>${esc(opt(q))}</option>`).join("")}</select>`;
  }
  return `<select id="dlq">${Object.entries(QLABEL).map(([k, l]) => `<option value="${k}" ${k === def ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}
const RIGHTS = `<label class="small" style="display:block;margin-top:10px"><input type="checkbox" id="dlok"> These are my videos, or I have permission to download and use them</label>`;

function dlRenderVideo(v) {
  const blocked = v.problem || v.duplicate;
  $("#dlpreview").innerHTML = `<div class="rec" style="margin-top:12px">
    ${v.thumbnail ? `<img src="${esc(v.thumbnail)}" style="width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:6px">` : ""}
    <div class="grow"><div class="name">${esc(v.title)}</div><div class="small muted">${esc(v.channel)} · ${hms(v.duration_s)}</div>
      ${blocked ? `<div class="small" style="color:var(--accent2);margin-top:6px">${esc(v.problem || v.duplicate)}</div>` : ""}</div></div>
    <div class="row" style="margin-top:10px"><label class="small" style="white-space:nowrap">Quality</label>${dlQualitySelect(v)}</div>${RIGHTS}
    <div class="row" style="margin-top:10px"><div class="grow"></div>
      <button class="primary" id="dlgo" ${blocked ? "disabled" : ""}>${v.problem && v.problem.includes("processing") ? "Waiting for YouTube" : "Add to queue"}</button></div>`;
  if (!blocked) $("#dlgo").onclick = () => dlAdd([v], null);
}

function dlRenderPlaylist(p) {
  const ok = e => !e.unavailable && !e.duplicate;
  const n = p.entries.filter(ok).length;
  $("#dlpreview").innerHTML = `<div class="rec" style="margin-top:12px">
    ${p.thumbnail ? `<img src="${esc(p.thumbnail)}" style="width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:6px">` : ""}
    <div class="grow"><div class="name">${esc(p.title)}</div><div class="small muted">${esc(p.channel)}${p.channel ? " · " : ""}${p.count} videos · ${n} can be downloaded</div></div></div>
    <label class="small" style="display:block;margin:10px 0 6px"><input type="checkbox" id="dlall" ${n ? "checked" : "disabled"} onchange="dlSelectAll(this.checked)"> Select all eligible videos</label>
    <div style="max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px">
    ${p.entries.map((e, i) => `<label class="row" style="padding:8px 10px;border-bottom:1px solid var(--line);${ok(e) ? "" : "opacity:.55"}">
      <input type="checkbox" class="dlpick" data-i="${i}" ${ok(e) ? "checked" : "disabled"} onchange="dlCount()">
      ${e.thumbnail ? `<img src="${esc(e.thumbnail)}" loading="lazy" style="width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:4px">` : ""}
      <div class="grow"><div>${esc(e.title)}</div><div class="small muted">${e.duration_s ? hms(e.duration_s) : ""}${e.channel ? " · " + esc(e.channel) : ""}</div>
        ${e.unavailable || e.duplicate ? `<div class="small" style="color:${e.unavailable ? "var(--bad)" : "var(--accent2)"}">${esc(e.unavailable || e.duplicate)}</div>` : ""}</div></label>`).join("")}</div>
    <div class="row" style="margin-top:10px"><label class="small" style="white-space:nowrap">Quality</label>${dlQualitySelect(null)}</div>${RIGHTS}
    <div class="row" style="margin-top:10px"><div class="grow"></div><button class="primary" id="dlgo" onclick="dlAddPicked()"></button></div>`;
  dlCount();
}
function dlSelectAll(on) { document.querySelectorAll(".dlpick:not(:disabled)").forEach(c => c.checked = on); dlCount(); }
function dlCount() {
  const n = document.querySelectorAll(".dlpick:checked").length;
  $("#dlgo").textContent = n ? `Add ${n} video${n > 1 ? "s" : ""} to queue` : "Select videos";
  $("#dlgo").disabled = !n;
}
function dlAddPicked() {
  const p = state.dl.preview;
  dlAdd([...document.querySelectorAll(".dlpick:checked")].map(c => p.entries[+c.dataset.i]), p.title);
}

async function dlAdd(items, playlistTitle) {
  if (!$("#dlok").checked) return toast("Tick the permission box first");
  try {
    const r = await api("/v1/downloads", { method: "POST", body: { items: items.map(e => ({ id: e.id, title: e.title, channel: e.channel,
      duration_s: e.duration_s, thumbnail: e.thumbnail })), quality: $("#dlq").value, playlist_title: playlistTitle, confirm_rights: true } });
    const skip = r.skipped.length ? ` · ${r.skipped.length} skipped (${esc(r.skipped[0].reason.toLowerCase())}${r.skipped.length > 1 ? ", …" : ""})` : "";
    toast(`${r.added} added to the queue${skip}`);
    $("#dlpreview").innerHTML = ""; $("#dlvideo").value = ""; $("#dlplaylist").value = "";
    stopPolling(); dlPoll();
  } catch (e) { toast(e.message); }
}

// --- queue ---
function dlRenderQueue(queue) {
  const sig = JSON.stringify(queue.map(d => [d.id, d.status, Math.round((d.progress || 0) * 1000), d.speed_bps, d.step, d.error]));
  if (sig === state.dl.sig.queue) return; state.dl.sig.queue = sig;
  const el = $("#dlqueue");
  if (!queue.length) { el.innerHTML = `<div class="card muted">The queue is empty. Paste a video or playlist link above. Finished downloads move to <a href="#" onclick="dlTab('library');return false">Downloaded videos</a>.</div>`; return; }
  el.innerHTML = `<div class="card"><h2>Queue</h2>${queue.map(d => {
    const [label, cls] = DST[d.status] || [d.status, "b-maybe"];
    const live = d.status === "downloading";
    const detail = live ? [speed(d.speed_bps), eta(d.eta_s), d.total_bytes ? "of " + size(d.total_bytes) : ""].filter(Boolean).join(" · ") : "";
    const btn = (a, t, p) => `<button ${p ? 'class="primary"' : ""} onclick="dlAct('${d.id}','${a}')">${t}</button>`;
    const ctl = { downloading: btn("pause", "Pause") + btn("cancel", "Cancel"), queued: btn("pause", "Pause") + btn("remove", "Remove"),
      paused: btn("resume", "Resume", 1) + btn("cancel", "Cancel") + btn("remove", "Remove"),
      failed: btn("retry", "Retry", 1) + btn("remove", "Remove"), cancelled: btn("retry", "Retry", 1) + btn("remove", "Remove") }[d.status] || "";
    return `<div class="rec" style="align-items:flex-start">
      ${dlThumb(d) ? `<img src="${dlThumb(d)}" style="width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:6px" loading="lazy">` : ""}
      <div class="grow" style="min-width:0"><div class="name" style="word-break:normal">${esc(d.title)}</div>
        <div class="small muted">${[esc(d.channel), d.duration_s ? hms(d.duration_s) : "", QLABEL[d.quality] || d.quality + "p"].filter(Boolean).join(" · ")}${d.playlist_title ? " · from " + esc(d.playlist_title) : ""}</div>
        <div class="row" style="margin-top:8px;gap:8px"><span class="badge ${cls}">${label}</span>
          <span class="small">${Math.round((d.progress || 0) * 100)}%</span>
          <span class="small muted">${live ? esc(d.step && !d.step.startsWith("Downloading") ? d.step : "") : ""} ${esc(detail)}</span>
          ${d.throttled ? `<span class="small" style="color:var(--accent2)">YouTube is throttling this download</span>` : ""}</div>
        <div class="overall" style="margin-top:6px"><i style="width:${(d.progress || 0) * 100}%"></i></div>
        ${d.error ? `<div class="err small" style="margin-top:6px">${esc(d.error)}</div>` : ""}</div>
      <div class="row" style="gap:6px;flex-shrink:0">${ctl}</div></div>`; }).join("")}</div>`;
}

async function dlAct(id, action) {
  try { await api(`/v1/downloads/${id}/${action}`, { method: "POST" }); stopPolling(); dlPoll(); } catch (e) { toast(e.message); }
}

// --- library ---
function dlRenderLibrary(force) {
  const data = state.dl.data; if (!data) return;
  let lib = data.items.filter(d => d.status === "completed");
  const q = ($("#dlsearch")?.value || "").trim().toLowerCase(), f = $("#dlfilter")?.value, sort = $("#dlsort")?.value || "date_desc";
  if (q) lib = lib.filter(d => d.title.toLowerCase().includes(q));
  if (f) lib = lib.filter(d => d.editing === f);
  const [key, dir] = sort.split("_"), val = d => key === "date" ? d.completed_at : key === "dur" ? d.duration_s : d.size_bytes || 0;
  lib.sort((a, b) => (val(a) < val(b) ? -1 : val(a) > val(b) ? 1 : 0) * (dir === "asc" ? 1 : -1));
  const sig = JSON.stringify([q, f, sort, state.dl.playing, state.dl.confirm, lib.map(d => [d.id, d.editing, d.file_exists])]);
  if (!force && sig === state.dl.sig.library) return; state.dl.sig.library = sig;
  const el = $("#dllibrary");
  const all = data.items.filter(d => d.status === "completed").length;
  if (!lib.length) { el.innerHTML = `<div class="card muted">${all ? "No videos match." : "No downloads yet. Finished downloads appear here."}</div>`; return; }
  const st = data.storage;
  el.innerHTML = `<div class="small muted" style="margin-bottom:10px">${lib.length} of ${all} videos · downloads use ${size(st.used_bytes)}${st.free_bytes != null ? ` · ${size(st.free_bytes)} free on this drive` : ""}</div>
    <div class="grid">${lib.map(d => {
      const [el2, cls] = ED[d.editing] || ED.not_edited;
      const media = state.dl.playing === d.id && d.file_exists
        ? `<video src="/v1/downloads/${d.id}/video" controls autoplay style="width:100%;aspect-ratio:16/9;background:#000;display:block"></video>`
        : `<div class="thumb" style="background-image:url('${dlThumb(d)}');cursor:${d.file_exists ? "pointer" : "default"}" ${d.file_exists ? `onclick="dlPlay('${d.id}')"` : ""}>
            ${d.duration_s ? `<span class="when">${hms(d.duration_s)}</span>` : ""}${d.file_exists ? `<span class="rank">▶</span>` : ""}</div>`;
      const del = state.dl.confirm === d.id
        ? `<button style="border-color:var(--bad);color:var(--bad)" onclick="dlDelete('${d.id}')">Delete file?</button><button onclick="dlConfirm(null)">Keep</button>`
        : `<button onclick="dlConfirm('${d.id}')">Delete</button>`;
      return `<div class="card" style="padding:0;overflow:hidden;margin:0">${media}
        <div style="padding:12px"><div class="name" style="font-weight:600">${esc(d.title)}</div>
          <div class="small muted" style="margin:4px 0">${[res(d), d.size_bytes ? size(d.size_bytes) : "", "Downloaded " + new Date(d.completed_at).toLocaleDateString()].filter(Boolean).join(" · ")}</div>
          <div class="small muted" style="word-break:break-all" title="${esc(d.file_path)}">${esc(d.file_path)}</div>
          <div style="margin:8px 0"><span class="badge ${cls}">${el2}</span>${d.file_exists ? "" : ` <span class="badge b-bad">File missing</span>`}</div>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <button class="primary" ${d.file_exists ? "" : "disabled"} onclick="dlEdit('${d.id}')">${d.project_id ? "Open in editor" : "Edit video"}</button>
            <button ${d.file_exists ? "" : "disabled"} onclick="dlAct('${d.id}','reveal')">Show in folder</button>${del}</div></div></div>`; }).join("")}</div>`;
}
function dlPlay(id) { state.dl.playing = state.dl.playing === id ? null : id; dlRenderLibrary(true); }
function dlConfirm(id) { state.dl.confirm = id; dlRenderLibrary(true); }
async function dlDelete(id) {
  try { await api(`/v1/downloads/${id}/file`, { method: "DELETE" }); state.dl.confirm = null; toast("Deleted. Shorts made from it are kept."); stopPolling(); dlPoll(); }
  catch (e) { toast(e.message); }
}
async function dlEdit(id) {

    toast("Opening in the editor…");
    const r = await api(`/v1/downloads/${id}/edit`, { method: "POST" });
    await loadProjects(); openProject(r.project_id);
  } catch (e) { toast(e.message); }
}

  $("#dlsettings").innerHTML = `<div class="card"><h2>Download settings</h2>

async function dlChooseFolder() {

// ---------- Project ----------
async function openProject(id) {
  if (!edLeaveOk()) return;
  rlStop();
  leaveDownloads();
  stopPolling();
  const p = await api(`/v1/projects/${id}`);
  state.project = p; loadProjects();
  $("#main").innerHTML = `
    <h1>${esc(p.name)}</h1>
    <div class="sub" id="psub"></div>
    <div class="card" id="pipeline"></div>
    <div class="tabs">
      <div class="tab ${state.tab === "moments" ? "active" : ""}" onclick="setTab('moments')">Best moments</div>
      <div class="tab ${state.tab === "shorts" ? "active" : ""}" onclick="setTab('shorts')">Shorts</div>
    </div>
    <div id="tabbody"></div>`;
  const assets = await api(`/v1/projects/${id}/assets`);
  if (assets[0]) {
    const a = assets[0], d = a.media_info?.duration_s;
    $("#psub").textContent = `${a.source_uri}${d ? " · " + hms(d) : ""} · ${size(a.size_bytes)}`;
  }
  state._momentsShown = false; refresh();
}
function setTab(t) { state.tab = t; document.querySelectorAll(".tab").forEach((el, i) => el.classList.toggle("active", (i === 0) === (t === "moments"))); renderTab(); }

async function refresh() {
  const id = state.project?.id; if (!id) return;
  const jobs = await api(`/v1/projects/${id}/jobs`);
  const an = jobs.filter(j => j.type === "analyze").sort((a, b) => a.created_at < b.created_at ? 1 : -1)[0];
  renderPipeline(an);
  const busy = an && !["succeeded", "failed", "cancelled"].includes(an.status);
  // Redraw Best moments only when the analysis changes: a redraw closes any open dropdown
  const key = an ? `${an.id}|${an.status}` : "";
  if (state.tab === "shorts") await renderShorts();
  else if (!state._momentsShown || state._momKey !== key) { state._momKey = key; await renderMoments(an); }
  schedule(busy || (state.tab === "shorts" && state._shortsBusy) ? 1500 : 0);
}
function schedule(ms) { stopPolling(); if (ms) state.timer = setTimeout(refresh, ms); }
function leaveDownloads() { state.dl = null; if (/^#(downloads|edit\/)/.test(location.hash)) history.replaceState(null, "", location.pathname); }
function stopPolling() { clearTimeout(state.timer); state.timer = null; }
function renderTab() { state._momentsShown = false; refresh(); }

function renderPipeline(job) {
  const el = $("#pipeline");
  if (!job) { el.innerHTML = `<div class="row"><div class="grow">Not analysed yet.</div><button class="primary" onclick="analyze()">Find best moments</button></div>`; return; }
  const idx = STAGES.findIndex(([k]) => k === job.stage);
  const done = job.status === "succeeded";
  const stages = STAGES.map(([k, label], i) => {
    const cls = done || (idx > i) ? "done" : "";
    const w = cls ? 100 : (i === idx ? 50 : 0);
    return `<div class="stage ${cls}">${label}${i === idx && !done ? ' <span class="spin"></span>' : ""}<div class="bar"><i style="width:${w}%"></i></div></div>`;
  }).join("");
  let head;
  if (done) head = `<div class="row"><div class="grow"><b>Analysis complete</b></div><button onclick="analyze()">Re-run</button></div>`;
  else if (job.status === "failed") head = `<div class="row"><div class="grow err">Analysis failed: ${esc(job.error)}</div><button class="primary" onclick="analyze()">Resume</button></div>`;
  else if (job.status === "cancelled") head = `<div class="row"><div class="grow">Analysis stopped.</div><button class="primary" onclick="analyze()">Resume</button></div>`;
  else head = `<div class="row"><div class="grow"><b>Finding the best moments…</b> <span class="muted">${Math.round(job.progress * 100)}% · about 10–15 min for a 2 h stream. You can close this tab; it keeps going.</span></div>
      <button class="ghost" onclick="cancelJob('${job.id}')">Stop</button></div>`;
  el.innerHTML = head + (done ? "" : `<div class="stages">${stages}</div><div class="overall"><i style="width:${job.progress * 100}%"></i></div>`);
}
async function analyze() { try { await api(`/v1/projects/${state.project.id}/analyze`, { method: "POST", body: {} }); state._momentsShown = false; refresh(); } catch (e) { toast(e.message); } }
async function cancelJob(id) { await api(`/v1/jobs/${id}/cancel`, { method: "POST" }); refresh(); }

async function renderMoments(job) {
  const body = $("#tabbody"); if (!body || state.tab !== "moments") return;
  const id = state.project.id;
  let hs = [];
  try { hs = await api(`/v1/projects/${id}/highlights?limit=30`); } catch {}
  if (!hs.length) {
    body.innerHTML = `<div class="empty">${job && job.status !== "succeeded" ? "Moments will appear here when the analysis finishes." : "No moments yet."}</div>`;
    return;
  }
  state._momentsShown = true;
  const ratings = await api(`/v1/projects/${id}/ratings`);
  body.innerHTML = `
    <div class="card" id="makeShorts">${makeShortsForm(hs)}</div>
    <div class="grid">${hs.map(h => momentCard(h, ratings[h.id])).join("")}</div>`;
}

function momentCard(h, rating) {
  const ai = h.ai || {};
  const tier = h.tier ? `<span class="badge b-${h.tier}">${h.tier}</span>` : "";
  const tags = (ai.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  return `<div class="moment ${rating === false ? "rejected" : ""}" id="m-${h.id}">
    <div class="thumb" style="background-image:url('/v1/projects/${state.project.id}/moments/${h.id}/thumb.jpg')">
      <span class="rank">#${h.rank}</span><span class="when">${hms(h.start_s)} · ${Math.round(h.duration_s)}s</span></div>
    <div class="body">
      <div class="row">${tier}<span class="title grow">${esc(ai.title || "Moment at " + hms(h.peak_s))}</span></div>
      <div class="small">${esc(ai.what_happens || "")}</div>
      ${ai.reason ? `<div class="small muted">Why: ${esc(ai.reason)}</div>` : ""}
      <div class="tags">${tags}</div>
      <div class="vote">
        <button class="${rating === true ? "on-good" : ""}" onclick="rate('${h.id}', true)" title="More like this">👍 Keep</button>
        <button class="${rating === false ? "on-bad" : ""}" onclick="rate('${h.id}', false)" title="Fewer like this">👎 Skip</button>
      </div>
    </div></div>`;
}
async function rate(cid, good) {
  await api(`/v1/projects/${state.project.id}/moments/${cid}/rate`, { method: "POST", body: { good } });
  toast(good ? "Got it: more moments like this" : "Got it: fewer moments like this");
  state._momentsShown = false; refresh();
}

function makeShortsForm(hs) {
  const game = localStorage.getItem("cf_game") || "";
  const worthy = hs.filter(h => h.tier === "top" || h.tier === "strong").length;
  return `<h2>Make Shorts</h2>
    <div class="muted small">${worthy} moment${worthy === 1 ? "" : "s"} rated TOP/STRONG. Pick one or more styles:</div>
    <div class="styles">${Object.entries(STYLE_INFO).map(([k, [name, desc]]) => `
      <div class="style ${state.styles.has(k) ? "on" : ""}" onclick="toggleStyle('${k}', this)"><b>${name}</b><span class="small muted">${desc}</span>
        ${lengthPicker(k)}</div>`).join("")}</div>
    <div class="row">
      <label>Game <input type="text" id="game" value="${esc(game)}" placeholder="e.g. Phantom Blade Zero" style="width:220px"></label>
      <label>Moments <input type="number" id="top" value="4" min="1" max="20" style="width:70px"></label>

      <label class="small"><input type="checkbox" id="maybe"> include MAYBE moments</label>
      <label class="small"><input type="checkbox" id="plain"> no effects</label>
      <label class="small" title="White meme-style caption bar on top of Hype and Cinematic Shorts too. Unticked: each Short keeps its own setting (change it in the editor)."><input type="checkbox" id="cbar" ${localStorage.getItem("cf_cbar") === "1" ? "checked" : ""} onchange="localStorage.setItem('cf_cbar', this.checked ? '1' : '')"> caption bar on Hype/Cinematic</label>
      <div class="grow"></div>
      <button class="primary" onclick="makeShorts()">Make Shorts</button>
    </div>`;
}
function toggleStyle(k, el) { state.styles.has(k) ? state.styles.delete(k) : state.styles.add(k); el.classList.toggle("on"); }

const LEN_OPTS = [["", "Auto"], ["15", "up to 15 s"], ["20", "up to 20 s"], ["30", "up to 30 s"], ["45", "up to 45 s"], ["58", "up to 58 s (under 1 min)"], ["90", "up to 90 s"], ["custom", "Custom…"]];
const LEN_AUTO = { hype: "Auto: the whole moment", meme: "Auto: ~20 s", cinematic: "Auto: ~20 s" };
function lengthPicker(k) {
  const v = localStorage.getItem("cf_len_" + k) || "", c = localStorage.getItem("cf_lenc_" + k) || "25";
  return `<div class="row small" style="margin-top:8px;gap:6px" onclick="event.stopPropagation()" title="${LEN_AUTO[k] || "Auto"}. A limit: each Short keeps the length its moment needs, and only longer moments are cut down.">Max length
    <select id="slen-${k}" style="width:auto;padding:4px 6px" onchange="localStorage.setItem('cf_len_${k}', this.value); $('#slenc-${k}').hidden = this.value !== 'custom'">
      ${LEN_OPTS.map(([x, l]) => `<option value="${x}" ${x === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    <input type="number" id="slenc-${k}" min="5" max="180" step="1" style="width:62px;padding:4px 6px" value="${esc(c)}" ${v === "custom" ? "" : "hidden"}
      onchange="localStorage.setItem('cf_lenc_${k}', this.value)"></div>`;
}
function shortLengths() {
  const out = {};
  for (const k of Object.keys(STYLE_INFO)) {
    const v = $("#slen-" + k)?.value;
    const n = !v ? null : v === "custom" ? +$("#slenc-" + k).value : +v;
    out[k] = n >= 5 && n <= 180 ? n : null;
  }
  return out;
}

async function makeShorts() {
  const game = $("#game").value.trim(); localStorage.setItem("cf_game", game);
  try {
    await api(`/v1/projects/${state.project.id}/shorts`, { method: "POST", body: {
      styles: [...state.styles], top: +$("#top").value || 4, game: game || null,
      include_maybe: $("#maybe").checked, plain: $("#plain").checked, lengths: shortLengths(),
      caption_bar: $("#cbar").checked ? true : null } });
    state._shortsBusy = true; setTab("shorts"); toast("Making your Shorts…");
  } catch (e) { toast("Error: " + e.message); }
}

async function renderShorts() {
  const body = $("#tabbody"); if (!body) return;
  const s = await api(`/v1/projects/${state.project.id}/shorts`);
  const b = s.batch;
  const making = s.shorts.filter(c => c.music.work && c.music.work.busy).length;
  state._shortsBusy = !!(b && b.running) || s.rendering > 0 || making > 0;
  let head = "";
  if (b && b.error) head = `<div class="card err">${esc(b.error)}</div>`;
  else if (state._shortsBusy) {
    const pct = s.progress.length ? Math.round(s.progress.reduce((a, p) => a + p.progress, 0) / s.progress.length * 100) : 0;
    head = `<div class="card"><span class="spin"></span> <b>${b && b.running ? esc(b.step) : s.rendering ? `Rendering ${s.rendering} Short${s.rendering > 1 ? "s" : ""}… ${pct}%` : `Making music for ${making} Short${making > 1 ? "s" : ""}… the first one after a restart can take a few minutes while the AI music model loads`}</b>
      <div class="muted small">New Shorts appear below as they finish.</div></div>`;
  } else if (b && b.folder) {
    head = `<div class="card row"><div class="grow">Saved to <b>${esc(b.folder)}</b> (with a .txt of title, description and hashtags next to each).</div>
      <button data-path="${esc(b.folder)}" onclick="openFolder(this.dataset.path)">Open folder</button></div>`;
  }
  const filter = state.styleFilter;
  const visible = filter === "all" ? s.shorts : s.shorts.filter(c => c.style === filter);
  const ratingsP = api(`/v1/projects/${state.project.id}/ratings`);
  const shown = new Set([...body.querySelectorAll(".short")].map(e => e.dataset.key));
  const keys = visible.map(c => c.id + ":" + c.modified);
  const sameFilter = body.dataset.filter === filter && body.dataset.total === String(s.shorts.length);
  if (state._editing || (sameFilter && keys.length === shown.size && keys.every(k => shown.has(k)))) { $("#shortsHead") && ($("#shortsHead").innerHTML = head); return; }
  const ratings = await ratingsP;
  await loadMusic().catch(() => null);
  body.dataset.filter = filter; body.dataset.total = String(s.shorts.length);
  const bar = s.shorts.length ? filterBar(s.shorts) : "";
  let list;
  if (visible.length) list = `<div class="shorts">${visible.map(c => shortCard(c, ratings[c.candidate_id])).join("")}</div>`;
  else if (s.shorts.length) list = `<div class="empty">No ${STYLE_INFO[filter]?.[0] || filter} Shorts for this stream yet. Pick it under <a href="#" onclick="setTab('moments')">Make Shorts</a>.</div>`;
  else list = state._shortsBusy ? "" : `<div class="empty">No Shorts yet. Go to <a href="#" onclick="setTab('moments')">Best moments</a> and press Make Shorts.</div>`;
  body.innerHTML = `<div id="shortsHead">${head}</div>${bar}${list}`;
}

function filterBar(all) {
  const count = k => k === "all" ? all.length : all.filter(c => c.style === k).length;

  return `<div class="filters">${opts.map(([k, label]) => `

function setStyleFilter(k) {

  $("#tabbody").dataset.filter = ""; renderShorts();
}

        <label class="small muted">Description</label>
        <textarea rows="4" id="etd-${c.id}">${esc(p.description || "")}</textarea>
        <div class="row"><button class="primary" onclick="saveText('${c.id}')">Save &amp; re-render</button>
          <button class="ghost" onclick="toggleEdit('${c.id}')">Cancel</button></div>

function rlAutoStep() {

  const r = RL.r, src = r.sources.filter(s => s.project_id);
  const stage = k => (STAGES.find(([key]) => key === k) || [k, "Working"])[1];
  const frac = src.length ? src.reduce((t, s) => t + (s.status === "done" || s.status === "failed" ? 1 : s.progress || 0), 0) / src.length : 0;
  if (r.status === "picking") {
    el.innerHTML = `<div class="card"><h2><span class="spin"></span> Picking the best moments across all ${src.length} videos…</h2>
      <div class="muted">${r.ai ? `The AI editor (${esc(r.ai)}) is choosing and ordering the highlights: a strong hook first, no repeats of the same event, the best payoff last.` : "Ranking every moment on one scale, removing repeats of the same event and ordering them for pacing."}</div></div>`;
    return;
  }
  if (r.status !== "analysing") { el.innerHTML = `<div class="card muted">Analysis finished. ${r.moments.length ? `<a href="#" onclick="RL.step=3;rlRender();return false">See the highlights →</a>` : ""}</div>`; return; }

    <div class="row"><h2 class="grow" style="margin:0"><span class="spin"></span> Analysing ${src.length} video${src.length === 1 ? "" : "s"}</h2>

    <div class="overall" style="margin:12px 0 16px"><i style="width:${frac * 100}%"></i></div>
    <table class="rlq">${src.map(s => `<tr><td><b>${esc(s.name)}</b>${s.error ? `<div class="small err">${esc(s.error)}</div>` : ""}</td>

      <td style="width:220px"><div class="rlbar ${s.status === "done" ? "ok" : ""}"><i style="width:${(s.status === "done" ? 1 : s.progress || 0) * 100}%"></i></div></td></tr>`).join("")}</table>
    <div class="small muted" style="margin-top:12px">For each video SPHURA listens for speech, measures action from the picture and sound, then the AI judges the candidate moments. You can leave this page; it keeps going.</div></div>`;
}
async function rlCancel() { if (await rlCall("/cancel")) { RL.step = rlAutoStep(); rlRender(); } }

// Step 3: review
function rlTrim(m) {
  const cap = RL.r.clip_cap_s, len = m.end_s - m.start_s;
  if (len <= cap) return [m.start_s, m.end_s];
  if (m.finale) return [m.end_s - cap, m.end_s];
  const a = Math.max(m.start_s, Math.min(m.peak_s - 0.6 * cap, m.peak_s + 1.5 - cap, m.end_s - cap));
  return [+a.toFixed(2), +(a + cap).toFixed(2)];
}
function rlThumb(m) { return `/v1/reels/${RL.r.id}/moments/${encodeURIComponent(m.id)}/thumb.jpg`; }
function rlLengthPicker() {
  const t = RL.r.settings.target_s, custom = !RL_LENGTHS.includes(t);

    <select onchange="if(this.value==='c'){$('#rlcust').hidden=false;$('#rlcust input').focus()}else rlSet({target_s:+this.value})">
      ${RL_LENGTHS.map(x => `<option value="${x}" ${x === t ? "selected" : ""}>${x < 60 ? x + " seconds" : x === 60 ? "60 seconds" : x === 90 ? "90 seconds" : "3 minutes"}</option>`).join("")}
      <option value="c" ${custom ? "selected" : ""}>Custom…</option></select>
    <span id="rlcust" ${custom ? "" : "hidden"}><input type="number" min="10" max="600" style="width:70px" value="${t}" onchange="rlSet({target_s:+this.value})"> s</span></label>`;
}

    <div class="card"><div class="row">

      <button onclick="rlRegenerate(this)" title="Ask for a different selection and order">↻ Regenerate suggestions</button>

        <div><div class="row" style="gap:6px"><b>${esc(m.title)}</b>${m.category ? `<span class="badge b-maybe">${esc(m.category)}</span>` : ""}${m.tier ? `<span class="badge b-${m.tier}">${m.tier}</span>` : ""}</div>
          <div class="small muted">${esc(m.source_name)} · ${hms(m.start_s)}–${hms(m.end_s)} in the video</div>

             to <input type="number" step="0.5" min="0" value="${b}" onchange="rlEditPick('${m.id}','end_s',this.value)"> s <span class="muted">(${(b - a).toFixed(1)} s)</span></div>` : ""}</div>

async function rlSet(settings) { if (await rlCall("", { settings }, "PATCH")) rlBody(); }
async function rlRegenerate(btn) { btn.disabled = true; if (await rlCall("/regenerate")) { RL.step = 2; rlRender(); rlPoll(); } else btn.disabled = false; }
function rlSavePicks(redraw = true) {
  // Picks are saved as edited; a short pause batches quick changes
  clearTimeout(RL.save);
  return new Promise(ok => { RL.save = setTimeout(async () => { if (await rlCall("", { picks: RL.r.picks }, "PATCH") && redraw) rlBody(); ok(); }, 250); });
}
function rlToggle(id, on) {
  const p = RL.r.picks.find(x => x.moment_id === id);
  if (p) p.include = on;
  else if (on) { const m = RL.r.moments.find(x => x.id === id), [a, b] = rlTrim(m); RL.r.picks.push({ moment_id: id, start_s: a, end_s: b, include: true }); }
  rlSavePicks();
}
function rlEditPick(id, key, v) {
  const p = RL.r.picks.find(x => x.moment_id === id); if (!p) return;
  p[key] = Math.max(0, +v);
  if (p.end_s - p.start_s < 1) { if (key === "start_s") p.start_s = p.end_s - 1; else p.end_s = p.start_s + 1; }
  rlSavePicks();
}
function rlNudge(id, key, d) { const p = RL.r.picks.find(x => x.moment_id === id); if (p) rlEditPick(id, key, p[key] + d); }
function rlMovePick(id, d) {
  const inc = RL.r.picks.filter(p => p.include), i = inc.findIndex(p => p.moment_id === id), j = i + d;
  if (i < 0 || j < 0 || j >= inc.length) return;
  [inc[i], inc[j]] = [inc[j], inc[i]];
  RL.r.picks = [...inc, ...RL.r.picks.filter(p => !p.include)];
  rlSavePicks();
}

function rlPlaySeq(from) {
  const byId = Object.fromEntries(RL.r.moments.map(m => [m.id, m]));
  const seq = RL.r.picks.filter(p => p.include && byId[p.moment_id]);
  const v = $("#rlplayv"); if (!v || !seq.length) return;
  $("#rlplayer").hidden = false; $("#rlplayer").scrollIntoView({ block: "nearest" });
  RL.seq = { seq, i: from };
  const play = i => {
    if (!RL.seq || i >= seq.length) { rlStopSeq(); return; }
    RL.seq.i = i; const p = seq[i], m = byId[p.moment_id], src = `/v1/reels/${RL.r.id}/sources/${m.source_id}/video`;
    $("#rlplaylab").textContent = `${i + 1} / ${seq.length} · ${m.title}`;
    document.querySelectorAll(".rlseq").forEach((el, k) => el.style.borderColor = k === i ? "var(--accent)" : "");
    const go = () => { v.currentTime = p.start_s; v.play(); };

    v.ontimeupdate = () => { if (RL.seq && v.currentTime >= p.end_s) play(i + 1); };
  };
  play(from);
}

// ---------- Timeline editor ----------
function edOpen() { return !!(ed && $("#edtl")); }
function edLeaveOk() {
  // Leaving the editor with unsaved edits asks first; a confirmed leave drops them
  if (!edOpen() || !ed.dirty) return true;
  if (!confirm("You have unsaved changes in this Short.\n\nLeave without saving them? (Press Cancel, then Update preview or Save & export to keep them.)")) return false;
  ed.dirty = false; return true;
}
window.addEventListener("beforeunload", e => { if (edOpen() && ed.dirty) { e.preventDefault(); e.returnValue = ""; } });
const ED_STYLES = { plain: "Subtitle", hook: "Pop-in hook", caps: "Caps opener", bar: "Meme caption bar" };
const FX_NAMES = { cold_open: "Cold open (climax first)", zoom: "Zoom punches", shake: "Camera shake", slowmo: "Slow motion",
  flash: "Flashes & glitches", rgb: "RGB split", trail: "Motion trail", vignette: "Vignette", letterbox: "Letterbox bars", sfx: "Sound effects" };
let ed = null;

async function openEditor(id) {
  rlStop();
  stopPolling(); leaveDownloads();
  history.replaceState(null, "", "#edit/" + id);
  $("#main").innerHTML = `<div class="card"><span class="spin"></span> Opening the editor…</div>`;
  try {
    const st = await api(`/v1/clips/${id}/editor`);
    ed = { st, sel: null, dirty: false, pps: 40, busy: false, audio: null, audioKey: null };
    renderEditor();
    if (!st.has_draft) edRender("draft", true);
  } catch (e) { $("#main").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

function edTotal() {
  // Client-side length while editing: server numbers until parts change, then 1:1 sums
  const s = ed.st;
  return ed.dirtyCuts ? s.teaser_out + s.segments.reduce((a, [x, y]) => a + (y - x), 0) : s.duration;
}
function edSegOut() {
  const s = ed.st;
  if (!ed.dirtyCuts) return s.segments_out;
  let t = s.teaser_out;
  return s.segments.map(([a, b]) => { const r = [t, t + (b - a)]; t += b - a; return r; });
}

function renderEditor() {
  const s = ed.st;
  const back = s.project_id ? `openProject('${s.project_id}').then(() => document.querySelectorAll('.tab').forEach(t => /Shorts/.test(t.textContent) && t.click()))` : "showNew()";

function edSetSeg(i, j, v) { const seg = ed.st.segments[i]; seg[j] = Math.max(0, Math.min(ed.st.source_duration, +v)); if (seg[1] - seg[0] < 0.3) seg[j] = j ? seg[0] + 0.3 : seg[1] - 0.3; ed.dirty = ed.dirtyCuts = true; edDraw(); edInspector(); if (ed.orig) $("#edvid").currentTime = seg[j]; }
