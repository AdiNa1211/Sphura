<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme = localStorage.getItem("sphura_theme") || "graphite";</script>
<title>SPHURA</title>
<style>
  /* Design tokens: charcoal/slate neutrals, one accent, 4px spacing grid */
  /* Themes: each sets the neutrals and the one accent; everything else reads these */
  :root, [data-theme=graphite] {
    --bg: #0e0e10; --panel: #151517; --panel2: #1c1c1f; --raised: #25252a; --line: #26262a; --line2: #34343a;
    --text: #ececee; --muted: #8e8e96; --faint: #606068; --sunk: #0a0a0b; --track: #1a1a1d; --glass: rgba(21,21,23,.94);
    --accent: #8b7cf6; --accent-h: #9d90f8; --on-accent: #fff; --acc-rgb: 139,124,246;
  }
  [data-theme=midnight] {
    --bg: #0a0e16; --panel: #0f1520; --panel2: #151c29; --raised: #1c2535; --line: #1c2433; --line2: #293346;
    --text: #e6ebf4; --muted: #8592a8; --faint: #5a667d; --sunk: #070a10; --track: #131a26; --glass: rgba(15,21,32,.94);
    --accent: #2dd4bf; --accent-h: #5eead4; --on-accent: #042f2a; --acc-rgb: 45,212,191;
  }
  [data-theme=mono] {
    --bg: #09090b; --panel: #111113; --panel2: #18181b; --raised: #222226; --line: #212125; --line2: #2f2f34;
    --text: #f4f4f5; --muted: #8f8f98; --faint: #5c5c65; --sunk: #050506; --track: #151518; --glass: rgba(17,17,19,.94);
    --accent: #f4f4f5; --accent-h: #ffffff; --on-accent: #09090b; --acc-rgb: 244,244,245;
  }
  [data-theme=ember] {
    --bg: #0c0d10; --panel: #131419; --panel2: #1a1c22; --raised: #22252c; --line: #24262d; --line2: #30333c;
    --text: #e7e8eb; --muted: #8c909b; --faint: #5f636d; --sunk: #0a0b0e; --track: #17191f; --glass: rgba(19,20,25,.94);
    --accent: #ff6a3d; --accent-h: #ff7d55; --on-accent: #fff; --acc-rgb: 255,106,61;
  }
  :root {
    --accent-bg: rgba(var(--acc-rgb), .13); --accent2: #e8a33d; --good: #3ecf8e; --bad: #f2555a; --blue: #7aa7ff;
    --radius: 8px; --r-sm: 6px; --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --fs-xs: 11px; --fs-sm: 12px; --fs: 13px; --fs-md: 15px; --fs-lg: 20px;
  }
  .themes { display: flex; gap: 6px; padding: 8px 0 2px; align-items: center; }
  .themes i { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line2); }
  .themes i.on { box-shadow: 0 0 0 2px var(--text); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: dark; }
  body { margin: 0; font: var(--fs)/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-bg); }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
  .ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }

  button { font: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--line2); background: var(--panel2);
           color: var(--text); border-radius: var(--r-sm); padding: 5px 11px; display: inline-flex; align-items: center; gap: 6px;
           line-height: 20px; transition: background .12s, border-color .12s, color .12s; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--raised); border-color: #3b3f49; }
  button:focus-visible, .tab:focus-visible, .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { background: var(--panel2); border-color: transparent; color: var(--text); }
  button.icon { padding: 5px; }
  button.small, .small button { font-size: var(--fs-sm); padding: 3px 8px; }
  input[type=text], input[type=number], input[type=password], textarea, select { font: inherit; color: var(--text); background: var(--bg);
           border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 5px 9px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
  a { color: var(--text); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 2px; }
  a:hover { text-decoration-color: var(--accent); }
  details > summary { cursor: pointer; list-style: none; color: var(--muted); user-select: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  details > summary:hover { color: var(--text); }
  [data-tip] { position: relative; }
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
    background: #000; color: #fff; font-size: var(--fs-xs); font-weight: 500; padding: 3px 7px; border-radius: 4px; white-space: nowrap; pointer-events: none; z-index: 60; }

  /* Shell: compact sidebar, workspace takes the rest */
  .layout { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: var(--s3); background: var(--panel); position: sticky; top: 0; height: 100vh;
          display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .logo { font-weight: 800; font-size: 15px; letter-spacing: .06em; padding: 4px 8px 14px; }
  .logo span { color: var(--accent); }
  aside > button.primary { justify-content: center; margin-bottom: 10px; }
  aside h3 { margin: 14px 8px 4px; font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .nav { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); color: var(--muted); cursor: pointer; user-select: none; }
  .nav:hover { background: var(--panel2); color: var(--text); }
  .nav.on { background: var(--raised); color: var(--text); }
  .proj { padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer; color: var(--muted); }
  .proj:hover { background: var(--panel2); color: var(--text); }
  .proj.active { background: var(--raised); color: var(--text); }
  .proj .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .meta { font-size: var(--fs-xs); color: var(--faint); }
  .pills { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .pill { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.ok::before, .pill.warn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .pill.ok::before { background: var(--good); } .pill.warn::before { background: var(--accent2); }
  main { padding: var(--s5) var(--s6) 80px; min-width: 0; }
  main > * { max-width: 1320px; }
  main.wide > * { max-width: none; }
  h1 { font-size: var(--fs-lg); font-weight: 650; margin: 0 0 2px; letter-spacing: -.01em; }
  h2 { font-size: var(--fs-md); font-weight: 600; margin: 0 0 var(--s2); }
  .sub { color: var(--muted); margin-bottom: var(--s4); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pagehead { display: flex; align-items: flex-start; gap: var(--s3); margin-bottom: var(--s4); }
  .pagehead .sub { margin: 0; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); margin-bottom: var(--s3); }
  .card.flat { background: transparent; border: 0; padding: 0; }
  .row { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); } .small { font-size: var(--fs-sm); } .faint { color: var(--faint); }
  .err { color: var(--bad); white-space: pre-wrap; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .rec { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 10px; border-radius: var(--r-sm); border: 1px solid var(--line); margin-bottom: 6px; background: var(--panel2); }
  .rec .name { font-weight: 500; word-break: break-all; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; background: var(--raised); color: var(--muted); white-space: nowrap; }
  .b-obs { color: #b99bff; } .b-top { background: var(--accent-bg); color: var(--accent); } .b-strong { color: var(--blue); }
  .b-maybe { color: var(--faint); } .b-meme, .b-cinematic, .b-hype { color: var(--muted); }

  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s2); margin: var(--s3) 0 var(--s2); }
  .stage { padding: 6px 0; font-size: var(--fs-sm); color: var(--muted); }
  .stage .bar { height: 3px; border-radius: 3px; background: var(--line2); margin-top: 6px; overflow: hidden; }
  .stage .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .stage.done .bar i { background: var(--good); width: 100%; }
  .stage.done { color: var(--text); }
  .overall { height: 3px; border-radius: 3px; background: var(--line2); overflow: hidden; }
  .overall i { display: block; height: 100%; background: var(--accent); transition: width .4s; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 var(--s4); }
  .tab { padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .tab .n { font-size: var(--fs-xs); color: var(--faint); margin-left: 5px; font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s3); }
  .moment { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: border-color .12s; }
  .moment:hover { border-color: var(--line2); }
  .moment.rejected { opacity: .45; }
  .moment.flash { border-color: var(--accent); }
  .thumb { aspect-ratio: 16/9; background: #000 center/cover no-repeat; position: relative; }
  .thumb .rank { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.7); padding: 0 6px; border-radius: 4px; font-weight: 600; font-size: var(--fs-sm); }
  .thumb .when { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.7); padding: 0 6px; border-radius: 4px; font-size: var(--fs-xs); }
  .moment .body { padding: 10px var(--s3) var(--s3); display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .moment .title { font-weight: 600; }
  .moment details { font-size: var(--fs-sm); }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: var(--fs-xs); color: var(--muted); background: var(--panel2); padding: 0 6px; border-radius: 4px; }
  .vote { display: flex; gap: 4px; margin-top: auto; padding-top: 4px; }
  .vote button { padding: 3px 9px; font-size: var(--fs-sm); }
  .vote button:not(.primary) { background: transparent; }
  .vote button.icon { padding: 4px 6px; }
  .vote button.on-good { border-color: var(--good); color: var(--good); }
  .vote button.on-bad { border-color: var(--bad); color: var(--bad); }

  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin: 10px 0 14px; }
  .style { border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px var(--s3); cursor: pointer; background: var(--panel2); }
  .style.on { border-color: var(--accent); background: var(--accent-bg); }
  .style b { display: block; margin-bottom: 2px; }

  .shorts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--s4); }
  .short { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .short.chosen { border-color: var(--accent); }
  .short video { width: 100%; display: block; background: #000; aspect-ratio: 9/16; max-height: 440px; object-fit: contain; }
  .short .body { padding: 10px var(--s3) var(--s3); display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .short .meta { font-size: var(--fs-xs); color: var(--faint); }
  .copyrow { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .copyrow button { font-size: var(--fs-sm); padding: 4px 7px; }
  .edit { display: flex; flex-direction: column; gap: 5px; padding-top: var(--s2); border-top: 1px solid var(--line); margin-top: 2px; }
  .edit input, .edit textarea { width: 100%; }
  .ontext { background: var(--panel2); padding: 0 6px; border-radius: 4px; }
  .filters { display: flex; gap: 6px; margin-bottom: var(--s3); flex-wrap: wrap; }
  .chip { border-radius: 99px; padding: 3px 12px; font-size: var(--fs-sm); background: transparent; }
  .chip span { color: var(--faint); margin-left: 2px; }
  .chip.on { background: var(--raised); border-color: var(--line2); color: var(--text); }
  .chip.on span { color: var(--muted); }
  .aibox { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s2) 10px; font-size: var(--fs-sm); }
  .libbtn { display: flex; flex-direction: column; gap: 2px; padding: 10px var(--s3); border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel2); color: var(--text); text-decoration: none; flex: 1; min-width: 200px; }
  .libbtn:hover { border-color: var(--line2); }
  .b-bad { color: var(--bad); } .b-lic { color: var(--good); } .b-warn { color: var(--accent2); }
  .musicrow { display: flex; align-items: center; gap: var(--s2); }
  .musicrow button { padding: 1px 7px; font-size: var(--fs-sm); }
  select { width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .drop { margin-top: var(--s3); border: 1px dashed var(--line2); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); background: var(--accent-bg); }
  .empty { text-align: center; padding: 36px var(--s4); color: var(--muted); border: 1px dashed var(--line2); border-radius: var(--radius); }
  .empty b { display: block; color: var(--text); font-size: var(--fs-md); margin-bottom: 4px; }
  .empty .row { justify-content: center; margin-top: var(--s3); }

  /* Make Shorts: ranked plan list with a sticky action bar */
  .plans { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
  .plan { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--s3); padding: var(--s3) var(--s4); border-top: 1px solid var(--line); align-items: start; }
  .plan:first-child { border-top: 0; }
  .plan:hover { background: var(--panel2); }
  .plan .n { color: var(--faint); font-weight: 600; font-size: var(--fs-md); text-align: right; padding-top: 1px; }
  .plan .t { font-weight: 600; font-size: 14px; }
  .plan .why { color: var(--muted); font-size: var(--fs-sm); margin-top: 2px; }
  .appeal { font-size: var(--fs-sm); margin-top: 5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); }
  .appeal .hot { color: var(--text); } .appeal .hot .ic { color: var(--accent); }
  .appeal .trend { color: var(--accent2); }
  .vers { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-sm); overflow: hidden; }
  .vers button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 4px 10px; font-size: var(--fs-sm); }
  .vers button + button { border-left: 1px solid var(--line2); }
  .vers button.on { background: var(--accent-bg); color: var(--accent); }
  .vers button.made::after { content: "✓"; margin-left: 4px; color: var(--good); }
  .actionbar { position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4);
    background: var(--glass); border-top: 1px solid var(--line); backdrop-filter: blur(6px); }
  .seg-note { font-size: var(--fs-xs); color: var(--faint); }

  /* Voice Intelligence */
  .vit td { vertical-align: top; }
  .viform { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 6px 0; }
  .viform label { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); color: var(--muted); }
  .vpers { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .vper { border: 1px solid var(--line2); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; background: var(--panel); }
  .vper:hover { border-color: var(--faint); }
  .vper.on { border-color: var(--accent); background: var(--accent-bg); }
  .vsls { display: grid; grid-template-columns: repeat(3, minmax(200px, 1fr)); gap: 16px; }
  .vsl { display: grid; grid-template-columns: 1fr auto; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
  .vsl input { grid-column: 1 / -1; }
  .vsl b { color: var(--text); grid-row: 1; grid-column: 2; }
  .vtogs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .vtog { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; }
  .vtog input { margin-top: 3px; }
  .vtest { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; align-items: start; }
  .vseg { background: var(--panel2); border-radius: 4px; padding: 1px 5px; }
  .vo-line .vmood { display: block; width: 100%; font-size: var(--fs-xs); padding: 1px 4px; margin-top: 4px; }
  @media (max-width: 1100px) { .vtest { grid-template-columns: 1fr; } .viform { grid-template-columns: 1fr 1fr; } }

  /* Lore Studio */
  .ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: var(--s3); }
  .idea { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px var(--s4); display: flex; flex-direction: column; gap: 8px; }
  .idea:hover { border-color: var(--line2); }
  .idea .t { font-size: var(--fs-md); font-weight: 650; line-height: 1.3; }
  .vq { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 10px; background: var(--panel); }
  .vq h3 { margin: 0 0 6px; font-size: var(--fs-sm); }
  .vq .vqsec { margin-top: 12px; }
  .vq .vqsec > .faint { margin-bottom: 4px; }
  .vqstats { display: flex; gap: 20px; flex-wrap: wrap; }
  .vqstats b { font-size: 17px; }
  .vqflag { display: flex; gap: 8px; align-items: baseline; font-size: var(--fs-sm); padding: 3px 0; }
  .vqflag .k { font-size: var(--fs-xs); color: var(--muted); min-width: 78px; }
  .vqname { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--fs-sm); padding: 4px 0; border-top: 1px solid var(--line); }
  .vqtable { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .vqtable th { text-align: left; font-weight: 500; color: var(--muted); font-size: var(--fs-xs); padding: 4px 6px; }
  .vqtable td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  .vqtable tr.bad td:first-child { box-shadow: inset 2px 0 var(--accent2); }
  .vbgrid td { white-space: nowrap; }
  .conf { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
  .conf i { width: 44px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--c) var(--w), var(--line2) var(--w)); }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .strip .more { display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line2); border-radius: var(--r-sm); }
  .sthumb { position: relative; aspect-ratio: 16/9; border-radius: var(--r-sm); overflow: hidden; background: var(--sunk); cursor: pointer; }
  .sthumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .sthumb:hover img { transform: scale(1.04); }
  .sthumb span, .sthumb em { position: absolute; bottom: 4px; font-size: 10.5px; background: rgba(0,0,0,.72); color: #fff; padding: 0 5px; border-radius: 3px; font-style: normal; }
  .sthumb span { right: 4px; } .sthumb em { left: 4px; }

let state = { styleFilter: ["stories", "old"].includes(localStorage.getItem("cf_style_filter")) ? localStorage.getItem("cf_style_filter") : "stories", project: null, tab: location.hash === "#shorts" ? "shorts" : "make", timer: null, styles: new Set(["meme", "cinematic"]) };

const THEMES = { graphite: ["Graphite", "#8b7cf6"], midnight: ["Midnight", "#2dd4bf"], mono: ["Mono", "#f4f4f5"], ember: ["Ember", "#ff6a3d"] };
function setTheme(t) {

  $("#themes").innerHTML = `<span class="small faint" style="margin-right:2px">Theme</span>` + Object.entries(THEMES).map(([k, [n, c]]) =>
    `<i class="${k === t ? "on" : ""}" style="background:${c}" title="${n}" onclick="setTheme('${k}')"></i>`).join("");
}
function ic(n) { return `<svg class="ic"><use href="#i-${n}"/></svg>`; }
// Marks the sidebar entry for the current screen; the editor gets the full width
function nav(key) {
  document.querySelectorAll(".nav").forEach(el => el.classList.toggle("on", el.dataset.nav === key));
  if (typeof LS !== "undefined") clearTimeout(LS.timer);
  if (typeof VI !== "undefined") clearTimeout(VI.timer);
  if (key !== "project") document.querySelectorAll(".proj.active").forEach(el => el.classList.remove("active"));

}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function hms(t) { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }
function size(b) { return b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB"; }
function ago(sec) { const d = (Date.now() / 1000 - sec); if (d < 3600) return Math.max(1, Math.round(d / 60)) + " min ago";
  if (d < 86400) return Math.round(d / 3600) + " h ago"; return Math.round(d / 86400) + " days ago"; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
}

async function loadStatus() {
  try {

                            : `<span class="pill ok">AI: ${esc(s.ai.name)}${s.ai.local ? " (local)" : ""}</span>`);
    pills.push(`<span class="pill ok" style="cursor:pointer" onclick="showMusic()" title="SPHURA makes original music for each Short">Music: ${s.music.ai ? "AI music" : "SPHURA scores"}${s.music.tracks ? ` + ${s.music.tracks} track${s.music.tracks > 1 ? "s" : ""}` : ""}</span>`);
    if (s.encoders.length) pills.push(`<span class="pill ok">Encoder: ${esc(s.encoders[0].replace("h264_", "").toUpperCase())}</span>`);
    $("#pills").innerHTML = pills.join("");

}

async function loadProjects() {
  const hidden = new Set(await api("/v1/reels/hidden-projects").catch(() => []));

    <div class="proj ${state.project?.id === p.id ? "active" : ""}" onclick="openProject('${p.id}')">

      <div class="meta">${new Date(p.created_at).toLocaleDateString()}</div>

  return ps;
}

// ---------- New stream ----------
async function showNew() {
  if (!edLeaveOk()) return;
  nav("new");
  rlStop();
  leaveDownloads();
  stopPolling(); state.project = null; loadProjects();
  $("#main").innerHTML = `
    <h1>New stream</h1>
    <div class="sub">Pick a recording. SPHURA finds the best moments, then you choose how to cut them.</div>
    <div class="card">
      <h2>Paste a file path</h2>
      <div class="row"><input type="text" id="path" class="grow" placeholder='D:\\stream\\my recording.mp4'>
        <button class="ghost" onclick="browseVideo(this)">Browse…</button>
        <button class="primary" onclick="processPath($('#path').value.trim().replace(/^\\"|\\"$/g, ''))">Process</button></div>
    </div>
    <div class="card row">
      <div class="grow"><h2 style="margin:0">Or use a YouTube video or playlist</h2>
        <div class="small muted">Download it in Downloads, then click Edit video.</div></div>
      <button class="primary" onclick="showDownloads('queue')">Open Downloads</button>
    </div>
    <div class="card">
      <h2>Recent recordings</h2>
      <div id="recent"><span class="spin"></span> <span class="muted">Looking in your OBS folder, Videos, Downloads and other drives…</span></div>
    </div>`;
  try {
    const vids = await api("/v1/library/recent");
    $("#recent").innerHTML = vids.length ? vids.map(v => `
      <div class="rec">
        <div class="grow"><div class="name">${esc(v.name)} ${v.from_obs ? '<span class="badge b-obs">OBS</span>' : ""}</div>
          <div class="small muted">${esc(v.folder)} · ${size(v.size_bytes)} · ${ago(v.modified)}</div></div>
        <button class="primary" data-path="${esc(v.path)}" onclick="processPath(this.dataset.path)">Process</button>
      </div>`).join("") : `<div class="muted">No recordings found. Paste a path or use Browse above.</div>`;
  } catch (e) { $("#recent").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function browseVideo(btn) {
  btn.disabled = true;
  try { const r = await api("/v1/library/choose-file", { method: "POST" }); if (r.path) $("#path").value = r.path; }
  catch (e) { toast(e.message); }
  finally { btn.disabled = false; }
}

async function processPath(path) {
  if (!path) return toast("Enter a file path first");
  try {
    toast("Registering the recording…");
    const r = await api("/v1/ingest", { method: "POST", body: { path } });
    await api(`/v1/projects/${r.project.id}/analyze`, { method: "POST", body: {} });
    await loadProjects();
    openProject(r.project.id);
  } catch (e) { toast("Error: " + e.message); }
}

// ---------- Downloads ----------
const ED = { not_edited: ["Not edited", "b-maybe"], analysing: ["Analysing", "b-strong"], analysed: ["Ready for Shorts", "b-top"],
  shorts: ["Shorts made", "b-lic"], analysis_failed: ["Analysis failed", "b-warn"] };
const DST = { queued: ["Queued", "b-maybe"], downloading: ["Downloading", "b-strong"], paused: ["Paused", "b-warn"],
  failed: ["Failed", "b-bad"], cancelled: ["Cancelled", "b-maybe"] };
const QLABEL = { best: "Best available", 2160: "2160p (4K)", 1440: "1440p", 1080: "1080p", 720: "720p", 480: "480p" };
const FNAMES = { title_id: "Title [video id]", title: "Title", channel_title: "Channel - Title", date_title: "Date Title" };
function hms(s) { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; }
function speed(b) { return b ? (b > 1e6 ? (b / 1e6).toFixed(1) + " MB/s" : (b / 1e3).toFixed(0) + " KB/s") : ""; }
function eta(s) { if (s == null) return ""; s = Math.round(s); return s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min left` : s >= 60 ? `${Math.floor(s / 60)} min ${s % 60} s left` : `${s} s left`; }
function res(d) { return d.height ? `${d.height}p${d.fps > 31 ? Math.round(d.fps) : ""}` : ""; }
function dlThumb(d) { return d.thumbnail_path || d.thumbnail_url ? `/v1/downloads/${d.id}/thumb.jpg` : ""; }

async function showDownloads(tab) {
  if (!edLeaveOk()) return;
  nav("downloads");
  rlStop();
  stopPolling(); state.project = null; loadProjects();
  state.dl = { tab: tab || state.dl?.tab || "queue", sig: {}, playing: null, confirm: null, data: null };
  history.replaceState(null, "", state.dl.tab === "library" ? "#downloads/library" : "#downloads");
  $("#main").innerHTML = `<div class="row"><h1 class="grow">Downloads</h1><button onclick="dlToggleSettings()">⚙ Settings</button></div>
    <div class="sub">Download your YouTube videos and playlists, then turn them into Shorts. Only download videos you own or have permission to use.</div>
    <div id="dlsetup"></div><div id="dlwhere"></div><div id="dlsettings" hidden></div>
    <div class="tabs"><div class="tab" id="t-queue" onclick="dlTab('queue')">Download queue</div>
      <div class="tab" id="t-library" onclick="dlTab('library')">Downloaded videos</div></div>
    <div id="dl-queue">
      <div class="card"><h2>Add from YouTube</h2>
        <div class="row"><input type="text" id="dllink" class="grow" placeholder="Paste a YouTube video, playlist or channel link" oninput="dlKindHint()" onkeydown="if(event.key==='Enter')dlPreview()">
          <span id="dlkind" class="badge" hidden></span>
          <button class="primary" onclick="dlPreview()">Continue</button></div>
        <div id="dlpreview"></div></div>
      <div id="dlqueue"></div></div>
    <div id="dl-library" hidden>
      <div class="card row">
        <input type="text" id="dlsearch" class="grow" placeholder="Search by title" oninput="dlRenderLibrary(true)">
        <select id="dlsort" style="width:auto" onchange="dlRenderLibrary(true)">
          <option value="date_desc">Newest first</option><option value="date_asc">Oldest first</option>
          <option value="dur_desc">Longest</option><option value="dur_asc">Shortest</option>
          <option value="size_desc">Largest</option><option value="size_asc">Smallest</option></select>
        <select id="dlfilter" style="width:auto" onchange="dlRenderLibrary(true)"><option value="">All videos</option>
          ${Object.entries(ED).map(([k, [l]]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
      <div id="dllibrary"></div></div>`;
  dlTab(state.dl.tab);
  dlPoll();
}

function dlTab(t) {
  state.dl.tab = t;
  history.replaceState(null, "", t === "library" ? "#downloads/library" : "#downloads");
  $("#t-queue").classList.toggle("active", t === "queue"); $("#t-library").classList.toggle("active", t === "library");
  $("#dl-queue").hidden = t !== "queue"; $("#dl-library").hidden = t !== "library";
}

async function dlPoll() {
  if (!state.dl || !$("#dlqueue")) return;
  try {
    const data = await api("/v1/downloads"); state.dl.data = data;
    dlRenderSetup(data); dlRenderWhere(data);
    const queue = data.items.filter(d => d.status !== "completed"), lib = data.items.filter(d => d.status === "completed");
    $("#t-queue").innerHTML = `Download queue${queue.length ? ` <span class="muted">${queue.length}</span>` : ""}`;
    $("#t-library").innerHTML = `Downloaded videos${lib.length ? ` <span class="muted">${lib.length}</span>` : ""}`;
    dlRenderQueue(queue); dlRenderLibrary(false);
    if (!$("#dlsettings").hidden && !$("#dlsettings").innerHTML) dlRenderSettings();
    const busy = queue.some(d => d.status === "downloading" || d.status === "queued") || data.setup.running
      || lib.some(d => d.editing === "analysing");
    state.timer = setTimeout(dlPoll, busy ? 1000 : 4000);
  } catch (e) { $("#dlqueue").innerHTML = `<div class="card err">${esc(e.message)}</div>`; state.timer = setTimeout(dlPoll, 4000); }
}

function dlRenderWhere(data) {
  // Where new downloads go, changeable in one click (e.g. an external SSD)
  const el = $("#dlwhere"); if (!el || !data.settings) return;
  const f = data.settings.folder, st = data.storage || {}, gone = st.free_bytes == null;
  const sig = `${f}|${gone}|${Math.round((st.free_bytes || 0) / 1e9)}`; if (el.dataset.sig === sig) return; el.dataset.sig = sig;
  el.innerHTML = `<div class="card row" style="padding:10px 14px">${ic("folder")}
    <div class="grow" style="min-width:0"><div class="small muted">Download location</div>
      <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(f)}"><b>${esc(f)}</b>
      <span class="small ${gone ? "err" : "muted"}"> · ${gone ? "drive not connected: plug it in or pick another folder" : `${size(st.free_bytes)} free`}</span></div></div>
    ${gone ? "" : `<button class="ghost small" data-path="${esc(f)}" onclick="openFolder(this.dataset.path)">Open</button>`}
    <button class="small" onclick="dlChangeFolder()">${ic("folder")} Change location…</button></div>`;
}
async function dlChangeFolder() {
  try {
    const r = await api("/v1/downloads/settings/choose-folder", { method: "POST" });
    if (!r.folder) return;
    await api("/v1/downloads/settings", { method: "PUT", body: { folder: r.folder } });
    toast("New downloads will be saved to " + r.folder + ". Paused ones keep their progress.");
    $("#dlwhere").dataset.sig = ""; if ($("#dsfolder")) $("#dsfolder").value = r.folder; stopPolling(); dlPoll();
  } catch (e) { toast(e.message); }
}
function dlRenderSetup(data) {
  const el = $("#dlsetup");
  if (data.ready) { el.innerHTML = ""; return; }
  const s = data.setup;
  el.innerHTML = `<div class="card">${s.running ? ytBar(s.step, s.progress) : `<div class="row"><div class="grow"><b>One-time setup</b>
    <div class="small muted">SPHURA downloads the official yt-dlp and Deno (about 65 MB) into its own folder. Nothing is installed on your system.</div>
    ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}</div><button class="primary" onclick="dlTools()">Turn on YouTube downloads</button></div>`}</div>`;
}
function ytBar(step, p) { return `<div class="small muted" style="margin-bottom:6px">${esc(step)} · ${Math.round(p * 100)}%</div><div class="overall"><i style="width:${p * 100}%"></i></div>`; }
async function dlTools() { try { await api("/v1/downloads/tools", { method: "POST" }); stopPolling(); dlPoll(); } catch (e) { toast(e.message); } }

// --- import preview ---
// Same rules as the engine's link_kind: a watch link inside a playlist is the video
function dlLinkKind(url) {
  let u; try { u = new URL(url.trim()); } catch { return null; }
  if (!/(^|\.)(youtube\.com|youtu\.be)$/i.test(u.hostname)) return null;
  const path = u.pathname.replace(/\/$/, "");
  if (path === "/playlist" && u.searchParams.get("list")) return "playlist";
  if (/^\/(@[^/]+|channel\/[^/]+|c\/[^/]+|user\/[^/]+)(\/(videos|streams|shorts))?$/.test(path)) return "channel";
  return u.hostname.endsWith("youtu.be") || u.searchParams.get("v") || /^\/(shorts|live)\//.test(path) ? "video" : null;
}
function dlKindHint() {
  const k = dlLinkKind($("#dllink").value), el = $("#dlkind");
  el.hidden = !k; el.textContent = { video: "Video", playlist: "Playlist", channel: "Channel videos" }[k] || "";
}
async function dlPreview(playlist, link) {
  const url = (link || $("#dllink").value).trim();
  if (!url) return toast("Paste a YouTube link first");
  const kind = playlist ? "playlist" : dlLinkKind(url);
  const box = $("#dlpreview");
  box.innerHTML = `<div style="margin-top:12px"><span class="spin"></span> <span class="muted">Reading ${kind === "video" ? "the video's details" : kind === "channel" ? "the channel's videos" : kind === "playlist" ? "the playlist" : "the link"} from YouTube…</span></div>`;
  try {
    const v = await api("/v1/downloads/preview", { method: "POST", body: { url, playlist: playlist || (kind ? kind !== "video" : null) } });
    state.dl.preview = v;
    v.kind === "playlist" ? dlRenderPlaylist(v) : dlRenderVideo(v);
  } catch (e) { box.innerHTML = `<div class="err" style="margin-top:10px">${esc(e.message)}</div>`; }
}

function dlQualitySelect(v) {
  const def = state.dl.data?.settings.quality || "best";
  if (v && v.qualities) {
    const top = v.qualities[0], opt = q => `${q.label}${q.size_bytes ? " · about " + size(q.size_bytes) : ""}`;
    return `<select id="dlq"><option value="best">Best available${top ? ` (${esc(opt(top))})` : ""}</option>
      ${v.qualities.map(q => `<option value="${q.value}" ${q.value === def ? "selected" : ""}>${esc(opt(q))}</option>`).join("")}</select>`;
  }
  return `<select id="dlq">${Object.entries(QLABEL).map(([k, l]) => `<option value="${k}" ${k === def ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}
const RIGHTS = `<label class="small" style="display:block;margin-top:10px"><input type="checkbox" id="dlok"> These are my videos, or I have permission to download and use them</label>`;

function dlRenderVideo(v) {
  const blocked = v.problem || v.duplicate;
  $("#dlpreview").innerHTML = `<div class="rec" style="margin-top:12px">
    ${v.thumbnail ? `<img src="${esc(v.thumbnail)}" style="width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:6px">` : ""}
    <div class="grow"><div class="name">${esc(v.title)}</div><div class="small muted">${esc(v.channel)} · ${hms(v.duration_s)}</div>

      ${v.playlist_url ? `<div class="small muted" style="margin-top:6px">This video is part of a playlist. <a href="#" onclick="dlPreview(true, '${esc(v.playlist_url)}');return false">Get the whole playlist instead</a></div>` : ""}</div></div>
    <div class="row" style="margin-top:10px"><label class="small" style="white-space:nowrap">Quality</label>${dlQualitySelect(v)}</div>${RIGHTS}

}

  $("#dlpreview").innerHTML = `<div class="rec" style="margin-top:12px">
    ${p.thumbnail ? `<img src="${esc(p.thumbnail)}" style="width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:6px">` : ""}
    <div class="grow"><div class="name">${esc(p.title)}</div><div class="small muted">${esc(p.channel)}${p.channel ? " · " : ""}${p.count} videos · ${n} can be downloaded</div></div></div>
    <label class="small" style="display:block;margin:10px 0 6px"><input type="checkbox" id="dlall" ${n ? "checked" : "disabled"} onchange="dlSelectAll(this.checked)"> Select all eligible videos</label>
    <div style="max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px">
    ${p.entries.map((e, i) => `<label class="row" style="padding:8px 10px;border-bottom:1px solid var(--line);${ok(e) ? "" : "opacity:.55"}">

function dlSelectAll(on) { document.querySelectorAll(".dlpick:not(:disabled)").forEach(c => c.checked = on); dlCount(); }
function dlCount() {
  const n = document.querySelectorAll(".dlpick:checked").length;
  $("#dlgo").textContent = n ? `Add ${n} video${n > 1 ? "s" : ""} to queue` : "Select videos";
  $("#dlgo").disabled = !n;
}
function dlAddPicked() {
  const p = state.dl.preview;
  dlAdd([...document.querySelectorAll(".dlpick:checked")].map(c => p.entries[+c.dataset.i]), p.title);
}

async function dlAdd(items, playlistTitle) {
  if (!$("#dlok").checked) return toast("Tick the permission box first");
  try {
    const r = await api("/v1/downloads", { method: "POST", body: { items: items.map(e => ({ id: e.id, title: e.title, channel: e.channel,
      duration_s: e.duration_s, thumbnail: e.thumbnail })), quality: $("#dlq").value, playlist_title: playlistTitle, confirm_rights: true } });
    const skip = r.skipped.length ? ` · ${r.skipped.length} skipped (${esc(r.skipped[0].reason.toLowerCase())}${r.skipped.length > 1 ? ", …" : ""})` : "";
    toast(`${r.added} added to the queue${skip}`);
    $("#dlpreview").innerHTML = ""; $("#dllink").value = ""; dlKindHint();
    stopPolling(); dlPoll();
  } catch (e) { toast(e.message); }
}

// --- queue ---
function dlRenderQueue(queue) {
  const sig = JSON.stringify(queue.map(d => [d.id, d.status, Math.round((d.progress || 0) * 1000), d.speed_bps, d.step, d.error, Math.round((d.done_bytes || 0) / 1e6)]));
  if (sig === state.dl.sig.queue) return; state.dl.sig.queue = sig;
  const el = $("#dlqueue");
  if (!queue.length) { el.innerHTML = `<div class="card muted">The queue is empty. Paste a video or playlist link above. Finished downloads move to <a href="#" onclick="dlTab('library');return false">Downloaded videos</a>.</div>`; return; }
  el.innerHTML = `<div class="card"><h2>Queue</h2>${queue.map(d => {
    const [label, cls] = DST[d.status] || [d.status, "b-maybe"];
    const live = d.status === "downloading";
    const left = d.size_bytes ? Math.max(0, d.size_bytes - (d.done_bytes || 0)) : null;
    const bytes = d.size_bytes ? `${size(d.done_bytes || 0)} of ${size(d.size_bytes)} · ${size(left)} left` : d.total_bytes ? "of " + size(d.total_bytes) : "";
    const detail = live ? [bytes, speed(d.speed_bps), eta(d.eta_s)].filter(Boolean).join(" · ") : "";
    const btn = (a, t, p) => `<button class="small ${p ? "" : "ghost"}" onclick="dlAct('${d.id}','${a}')">${t}</button>`;
    const ctl = { downloading: btn("pause", "Pause") + btn("cancel", "Cancel"), queued: btn("pause", "Pause") + btn("remove", "Remove"),
      paused: btn("resume", "Resume", 1) + btn("cancel", "Cancel") + btn("remove", "Remove"),
      failed: btn("retry", "Retry", 1) + btn("remove", "Remove"), cancelled: btn("retry", "Retry", 1) + btn("remove", "Remove") }[d.status] || "";
    return `<div class="rec" style="align-items:flex-start">
      ${dlThumb(d) ? `<img src="${dlThumb(d)}" style="width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:6px" loading="lazy">` : ""}
      <div class="grow" style="min-width:0"><div class="name" style="word-break:normal">${esc(d.title)}</div>
        <div class="small muted">${[esc(d.channel), d.duration_s ? hms(d.duration_s) : "", QLABEL[d.quality] || d.quality + "p"].filter(Boolean).join(" · ")}${d.playlist_title ? " · from " + esc(d.playlist_title) : ""}</div>
        <div class="row" style="margin-top:8px;gap:8px"><span class="badge ${cls}">${label}</span>
          <span class="small">${Math.round((d.progress || 0) * 100)}%</span>
          <span class="small muted">${live ? esc(d.step && !d.step.startsWith("Downloading") ? d.step : "") : ""} ${esc(detail)}</span>
          ${d.throttled && d.speed_bps != null && d.speed_bps < 400e3 ? `<span class="small" style="color:var(--accent2)" title="YouTube is sending this video slowly. SPHURA updates its downloader daily, which usually fixes it; pausing and resuming can help too.">YouTube is slowing this download</span>` : ""}</div>
        <div class="overall" style="margin-top:6px"><i style="width:${(d.progress || 0) * 100}%"></i></div>
        ${d.error ? `<div class="err small" style="margin-top:6px">${esc(d.error)}</div>` : ""}</div>
      <div class="row" style="gap:6px;flex-shrink:0">${ctl}</div></div>`; }).join("")}</div>`;
}

// --- library ---
function dlRenderLibrary(force) {
  const data = state.dl.data; if (!data) return;
  let lib = data.items.filter(d => d.status === "completed");
  const q = ($("#dlsearch")?.value || "").trim().toLowerCase(), f = $("#dlfilter")?.value, sort = $("#dlsort")?.value || "date_desc";
  if (q) lib = lib.filter(d => d.title.toLowerCase().includes(q));
  if (f) lib = lib.filter(d => d.editing === f);
  const [key, dir] = sort.split("_"), val = d => key === "date" ? d.completed_at : key === "dur" ? d.duration_s : d.size_bytes || 0;
  lib.sort((a, b) => (val(a) < val(b) ? -1 : val(a) > val(b) ? 1 : 0) * (dir === "asc" ? 1 : -1));
  const sig = JSON.stringify([q, f, sort, state.dl.playing, state.dl.confirm, lib.map(d => [d.id, d.editing, d.file_exists])]);
  if (!force && sig === state.dl.sig.library) return; state.dl.sig.library = sig;
  const el = $("#dllibrary");
  const all = data.items.filter(d => d.status === "completed").length;
  if (!lib.length) { el.innerHTML = `<div class="card muted">${all ? "No videos match." : "No downloads yet. Finished downloads appear here."}</div>`; return; }
  const st = data.storage;
  el.innerHTML = `<div class="small muted" style="margin-bottom:10px">${lib.length} of ${all} videos · downloads use ${size(st.used_bytes)}${st.free_bytes != null ? ` · ${size(st.free_bytes)} free on this drive` : ""}</div>
    <div class="grid">${lib.map(d => {
      const [el2, cls] = ED[d.editing] || ED.not_edited;
      const media = state.dl.playing === d.id && d.file_exists
        ? `<video src="/v1/downloads/${d.id}/video" controls autoplay style="width:100%;aspect-ratio:16/9;background:#000;display:block"></video>`
        : `<div class="thumb" style="background-image:url('${dlThumb(d)}');cursor:${d.file_exists ? "pointer" : "default"}" ${d.file_exists ? `onclick="dlPlay('${d.id}')"` : ""}>
            ${d.duration_s ? `<span class="when">${hms(d.duration_s)}</span>` : ""}${d.file_exists ? `<span class="rank">▶</span>` : ""}</div>`;
      const del = state.dl.confirm === d.id
        ? `<button style="border-color:var(--bad);color:var(--bad)" onclick="dlDelete('${d.id}')">Delete file?</button><button onclick="dlConfirm(null)">Keep</button>`
        : `<button onclick="dlConfirm('${d.id}')">Delete</button>`;
      return `<div class="card" style="padding:0;overflow:hidden;margin:0">${media}
        <div style="padding:12px"><div class="name" style="font-weight:600">${esc(d.title)}</div>
          <div class="small muted" style="margin:4px 0">${[res(d), d.size_bytes ? size(d.size_bytes) : "", "Downloaded " + new Date(d.completed_at).toLocaleDateString()].filter(Boolean).join(" · ")}</div>
          <div class="small muted" style="word-break:break-all" title="${esc(d.file_path)}">${esc(d.file_path)}</div>
          <div style="margin:8px 0"><span class="badge ${cls}">${el2}</span>${d.file_exists ? "" : ` <span class="badge b-bad">File missing</span>`}</div>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <button class="primary" ${d.file_exists ? "" : "disabled"} onclick="dlEdit('${d.id}')">${d.project_id ? "Open in editor" : "Edit video"}</button>
            <button ${d.file_exists ? "" : "disabled"} onclick="dlAct('${d.id}','reveal')">Show in folder</button>${del}</div></div></div>`; }).join("")}</div>`;
}
function dlPlay(id) { state.dl.playing = state.dl.playing === id ? null : id; dlRenderLibrary(true); }
function dlConfirm(id) { state.dl.confirm = id; dlRenderLibrary(true); }
async function dlDelete(id) {
  try { await api(`/v1/downloads/${id}/file`, { method: "DELETE" }); state.dl.confirm = null; toast("Deleted. Shorts made from it are kept."); stopPolling(); dlPoll(); }
  catch (e) { toast(e.message); }
}
async function dlEdit(id) {

    toast("Opening in the editor…");
    const r = await api(`/v1/downloads/${id}/edit`, { method: "POST" });
    await loadProjects(); openProject(r.project_id);
  } catch (e) { toast(e.message); }
}

    <div class="row" style="gap:16px;align-items:flex-start">
      <div class="grow"><div class="small muted" style="margin-bottom:4px">Preferred quality</div>
        <select id="dsq">${Object.entries(QLABEL).map(([k, l]) => `<option value="${k}" ${k === s.quality ? "selected" : ""}>${l}</option>`).join("")}</select>

}
async function dlChooseFolder() {
  try { const r = await api("/v1/downloads/settings/choose-folder", { method: "POST" }); if (r.folder) $("#dsfolder").value = r.folder; }
  catch (e) { toast(e.message); }
}
async function dlSaveSettings() {

    await api("/v1/downloads/settings", { method: "PUT", body: { folder: $("#dsfolder").value, quality: $("#dsq").value,

// ---------- Project ----------
async function openProject(id) {
  if (!edLeaveOk()) return;
  nav("project");
  rlStop();
  leaveDownloads();
  stopPolling();
  const p = await api(`/v1/projects/${id}`);
  state.project = p; loadProjects();
  const tab = (k, label) => `<div class="tab ${state.tab === k ? "active" : ""}" data-tab="${k}" tabindex="0" onclick="setTab('${k}')">${label}<span class="n" id="tn-${k}"></span></div>`;
  $("#main").innerHTML = `
    <div class="pagehead"><div class="grow"><h1>${esc(p.name)}</h1><div class="sub" id="psub"></div></div><div class="row" id="pipehead"></div></div>
    <div id="pipeline"></div>
    <div class="tabs">${tab("make", "Make Shorts")}${tab("shorts", "Shorts")}${tab("moments", "Moments")}</div>
    <div id="tabbody"></div>`;
  const assets = await api(`/v1/projects/${id}/assets`);
  if (assets[0]) {
    const a = assets[0], d = a.media_info?.duration_s;
    $("#psub").textContent = `${a.source_uri}${d ? " · " + hms(d) : ""} · ${size(a.size_bytes)}`;
    $("#psub").title = a.source_uri;
  }
  state._momentsShown = false; refresh();
}
function setTab(t) {
  state.tab = t; history.replaceState(null, "", t === "shorts" ? "#shorts" : location.pathname);
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("active", el.dataset.tab === t));
  $("#tabbody") && ($("#tabbody").innerHTML = "", delete $("#tabbody").dataset.filter);
  renderTab();
}
async function refresh() {
  const id = state.project?.id; if (!id) return;
  const jobs = await api(`/v1/projects/${id}/jobs`);
  const an = jobs.filter(j => j.type === "analyze").sort((a, b) => a.created_at < b.created_at ? 1 : -1)[0];
  renderPipeline(an);
  const busy = an && !["succeeded", "failed", "cancelled"].includes(an.status);
  // Redraw Best moments only when the analysis changes: a redraw closes any open dropdown
  const key = an ? `${an.id}|${an.status}` : "";
  if (state.tab === "shorts") await renderShorts();
  else if (!state._momentsShown || state._momKey !== key) { state._momKey = key; await renderMoments(an); }
  schedule(busy || (state.tab === "shorts" && state._shortsBusy) ? 1500 : 0);
}
function schedule(ms) { stopPolling(); if (ms) state.timer = setTimeout(refresh, ms); }
function leaveDownloads() { state.dl = null; if (/^#(downloads|edit\/)/.test(location.hash)) history.replaceState(null, "", location.pathname); }
function stopPolling() { clearTimeout(state.timer); state.timer = null; }
function renderTab() { state._momentsShown = false; refresh(); }

function renderPipeline(job) {
  // Done: a quiet status in the header. Not started / running / failed: a card that says what to do
  const el = $("#pipeline"), head = $("#pipehead"); if (!el) return;
  const done = job && job.status === "succeeded";
  head.innerHTML = done ? `<span class="small muted">${ic("check")} Analysed</span><button class="ghost small" onclick="analyze()" title="Find the moments again, e.g. after an update">${ic("refresh")} Re-run</button>` : "";
  if (done) { el.innerHTML = ""; return; }
  if (!job) {
    el.innerHTML = `<div class="card row"><div class="grow"><b>Analyse this stream</b><div class="small muted">SPHURA listens to the speech, reads the action and judges every moment, then plans the Shorts worth making. About 10–15 min for a 2 h stream.</div></div>
      <button class="primary" onclick="analyze()">${ic("spark")} Find best moments</button></div>`;
    return;
  }
  if (job.status === "failed" || job.status === "cancelled") {
    el.innerHTML = `<div class="card row"><div class="grow">${job.status === "failed" ? `<b class="err">Analysis failed</b><div class="small err">${esc(job.error)}</div>` : `<b>Analysis stopped</b>`}
      <div class="small muted">Resuming keeps the finished steps.</div></div><button class="primary" onclick="analyze()">${ic("refresh")} Resume</button></div>`;
    return;
  }
  const idx = STAGES.findIndex(([k]) => k === job.stage);
  const stages = STAGES.map(([k, label], i) => {
    const cls = idx > i ? "done" : "";
    const w = cls ? 100 : (i === idx ? 50 : 0);
    return `<div class="stage ${cls}">${i === idx ? `<span class="spin"></span> ` : ""}${label}<div class="bar"><i style="width:${w}%"></i></div></div>`;
  }).join("");
  el.innerHTML = `<div class="card"><div class="row"><div class="grow"><b>Finding the best moments · ${Math.round(job.progress * 100)}%</b>
      <span class="small muted"> · ${esc(STAGES[idx]?.[1] || "Starting")} · it keeps going if you close this tab</span></div>
    <button class="ghost small" onclick="cancelJob('${job.id}')">${ic("stop")} Stop</button></div>
    <div class="stages">${stages}</div><div class="overall"><i style="width:${job.progress * 100}%"></i></div></div>`;
}
async function analyze() { try { await api(`/v1/projects/${state.project.id}/analyze`, { method: "POST", body: {} }); state._momentsShown = false; refresh(); } catch (e) { toast(e.message); } }
async function cancelJob(id) { await api(`/v1/jobs/${id}/cancel`, { method: "POST" }); refresh(); }

async function renderMoments(job) {
  const body = $("#tabbody"); if (!body || state.tab === "shorts") return;
  const id = state.project.id;
  let hs = [];
  try { hs = await api(`/v1/projects/${id}/highlights?limit=30`); } catch {}
  $("#tn-moments") && ($("#tn-moments").textContent = hs.length || "");
  if (!hs.length) {
    const busy = job && !["succeeded", "failed", "cancelled"].includes(job.status);
    body.innerHTML = `<div class="empty"><b>${busy ? "Working on it" : "No moments yet"}</b>${busy ? "Planned Shorts and moments appear here when the analysis finishes." : job ? "The analysis found nothing worth a Short. Try re-running it." : "Analyse the stream first."}</div>`;
    return;
  }
  state._momentsShown = true;
  if (state.tab === "make") {
    body.innerHTML = `<div id="planbox"><div class="card"><span class="spin"></span> Ranking the Shorts worth making…</div></div>
      <details class="card" style="margin-top:16px"><summary>Other ways to make Shorts <span class="faint">· styles and trend formats</span></summary><div id="makeShorts" style="margin-top:12px">${makeShortsForm(hs)}</div></details>`;
    planLoad(id);
    return;
  }
  const ratings = await api(`/v1/projects/${id}/ratings`);
  let stories = []; try { stories = await api(`/v1/projects/${id}/stories`); } catch {}
  body.innerHTML = `${storiesCard(stories, hs)}<div class="grid">${hs.map(h => momentCard(h, ratings[h.id])).join("")}</div>`;
  if (state._goto) {
    const el = $("#m-" + state._goto); state._goto = null;
    if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
  }
}
const PL = { data: null, picks: {} };
function planRow(p, i) {
  const a = p.appeal || {}, hot = a.lift >= 0.5;
  const tip = `${p.reason}\n\nHow it's cut: ${p.structure}`;
  return `<div class="plan">
    <div class="n">${i + 1}</div>
    <div style="min-width:0">
      <div class="row" style="gap:8px"><span class="badge b-viral">${esc(p.format_label)}</span><span class="t">${esc(p.title)}</span></div>
      <div class="why clamp2" title="${esc(tip)}">${esc(p.reason)}</div>
      <div class="appeal">
        ${a.n ? `<span class="${hot ? "hot" : ""}" title="From public YouTube Shorts of this game. Shows what the audience watches, it can't promise views.">${hot ? ic("flame") : ic("trend")} ${esc(a.basis)}</span>` : ""}
        ${(p.trending || []).length ? `<span class="trend" title="In Shorts trending right now">· trending now: ${esc(p.trending.join(", "))}</span>` : ""}
        ${p.moments.map(m => `<a href="#" class="faint" onclick="return goMoment('${m.id}')">${hms(m.start_s)}</a>`).join(" ")}
      </div>
    </div>
    <div class="vers">${p.variants.map(v => `<button class="${PL.picks[p.key].has(v.id) ? "on" : ""} ${p.made[v.id] ? "made" : ""}" title="${esc(v.label)}: ${esc(v.about)}${p.made[v.id] ? " (already made)" : ""}"
      onclick="planPick('${p.key}','${v.id}',!PL.picks['${p.key}'].has('${v.id}'));this.classList.toggle('on')">${v.id}</button>`).join("")}</div>
  </div>`;
}
function goMoment(id) { state._goto = id; setTab("moments"); return false; }
async function planLoad(id) {
  try { PL.data = await api(`/v1/projects/${id}/plans`); } catch (e) { PL.data = { plans: [], error: e.message }; }
  // One clean version each by default; nothing for Shorts already made
  PL.picks = {};
  for (const p of PL.data.plans) PL.picks[p.key] = new Set(Object.keys(p.made).length ? [] : p.variants.slice(0, 1).map(v => v.id));
  planRender();
}
function planRender() {
  const el = $("#planbox"); if (!el || !PL.data) return;
  const ps = PL.data.plans;
  if (!ps.length) {
    el.innerHTML = `<div class="empty"><b>No Short worth making yet</b>${esc(PL.data.error || "No moment here is strong enough on its own. Check Moments, or try the other ways below.")}
      ${PL.data.error ? `<div class="row"><button onclick="planLoad('${state.project.id}')">${ic("refresh")} Try again</button></div>` : ""}</div>`;
    return;
  }
  const upd = PL.data.research_updated, age = upd ? Math.floor((Date.now() - new Date(upd)) / 864e5) : null;
  const research = upd ? `YouTube research ${age < 1 ? "from today" : `${age} day${age > 1 ? "s" : ""} old`}${PL.data.research_refreshing ? " · refreshing now" : ""}`
    : `<a href="#" onclick="showIntel('setup');return false">Add YouTube research</a> to rank by what gets views`;
  el.innerHTML = `<div class="row" style="margin-bottom:10px"><div class="grow"><h2 style="margin:0">Shorts worth making</h2>
      <div class="small muted">Best first: how strong the moment is, and how Shorts about it do on YouTube. Each is one continuous beat in 9:16.</div></div>
      <span class="small faint">${research}</span></div>
    <div class="plans">${ps.map((p, i) => planRow(p, i)).join("")}
      <div class="actionbar"><div class="grow small muted" id="planCount"></div>
        <span class="seg-note">C clean · A cinematic · B edit</span>
        <button class="primary" id="planGo" onclick="planMake()">${ic("scissors")} Make selected</button></div></div>`;
  planCount();
}
function planPick(key, v, on) { PL.picks[key][on ? "add" : "delete"](v); planCount(); }
function planCount() {
  const n = Object.values(PL.picks).reduce((a, s) => a + s.size, 0);
  const el = $("#planCount"); if (el) el.textContent = `${n} Short${n === 1 ? "" : "s"} to make`;
  const b = $("#planGo"); if (b) b.disabled = !n;
}
async function planMake() {
  const picks = Object.entries(PL.picks).filter(([, s]) => s.size).map(([key, s]) => ({ key, variants: [...s] }));
  const game = ($("#game") && $("#game").value.trim()) || localStorage.getItem("cf_game") || "";
  const b = $("#planGo"); if (b) { b.disabled = true; b.innerHTML = `<span class="spin"></span> Starting…`; }
  try {
    await api(`/v1/projects/${state.project.id}/plans`, { method: "POST", body: { picks, game } });
    toast("Cutting your Shorts. They appear in Shorts as they finish.");
    state.styleFilter = "stories"; localStorage.setItem("cf_style_filter", "stories"); setTab("shorts");
  } catch (e) { toast(e.message); if (b) { b.disabled = false; b.innerHTML = `${ic("scissors")} Make selected`; } }
}
const STORY_KIND = { boss: "⚔️ Boss fight", combat: "🗡 Fight", story: "🎭 Story", unexpected: "😮 Unexpected" };
const FORMAT_LABEL = { story: "story", combat: "combat", boss: "boss", unexpected: "unexpected", lore: "lore", discovery: "discovery" };
function storiesCard(stories, hs) {
  // Moments that belong together, collapsed so the grid stays the focus
  if (!stories.length) return "";
  const byId = Object.fromEntries(hs.map(h => [h.id, h]));
  return `<details class="card"><summary><b style="color:var(--text)">Stories in this video</b> <span class="faint">· ${Math.min(6, stories.length)} chains of moments that belong together</span></summary>
    ${stories.slice(0, 6).map(s => `<div style="margin-top:10px">
      <b>${STORY_KIND[s.kind] || esc(s.kind)}</b>${s.names.length ? ` <span class="muted">· ${esc(s.names.slice(0, 3).map(n => n.replace(/\b\w/g, c => c.toUpperCase())).join(", "))}</span>` : ""}
      <div class="small muted">${esc(s.why)}</div>
      <div class="small">${s.moments.map(m => { const h = byId[m]; const role = s.roles[m];
        return `<a href="#m-${m}">${role === "payoff" ? "🎯 " : role === "setup" ? "▶ " : "↗ "}${esc(h && h.ai ? h.ai.title : "moment")}</a>`; }).join(" → ")}</div></div>`).join("")}</details>`;
}

function momentCard(h, rating) {
  const ai = h.ai || {};
  const tier = h.tier ? `<span class="badge b-${h.tier}">${h.tier}</span>` : "";
  const tags = (ai.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const facts = momentFacts(h);
  return `<div class="moment ${rating === false ? "rejected" : ""}" id="m-${h.id}">
    <div class="thumb" style="background-image:url('/v1/projects/${state.project.id}/moments/${h.id}/thumb.jpg')">
      <span class="rank">#${h.rank}</span><span class="when">${hms(h.start_s)} · ${Math.round(h.duration_s)}s</span></div>
    <div class="body">
      <div class="row" style="gap:6px">${tier}<span class="title grow">${esc(ai.title || "Moment at " + hms(h.peak_s))}</span></div>
      <div class="small muted clamp2" title="${esc(ai.what_happens || "")}">${esc(ai.what_happens || "")}</div>
      ${facts || ai.reason || tags ? `<details><summary>Details</summary>${facts}${ai.reason ? `<div class="small muted" style="margin-top:4px">Why: ${esc(ai.reason)}</div>` : ""}<div class="tags" style="margin-top:6px">${tags}</div></details>` : ""}
      <div class="vote">
        <button class="${rating === true ? "on-good" : ""}" onclick="rate('${h.id}', true)" title="More like this">${ic("up")} Keep</button>
        <button class="${rating === false ? "on-bad" : ""}" onclick="rate('${h.id}', false)" title="Fewer like this">${ic("down")} Skip</button>
      </div>
    </div></div>`;
}
function momentFacts(h) {
  // Moment database v2: who is there, what is said, what it could become
  const ai = h.ai || {}, out = [];
  const who = [...new Set([...(ai.names || []), ...(ai.characters || [])])];
  if (who.length) out.push(`👤 ${esc(who.slice(0, 4).join(", "))}`);
  if ((ai.dialogue || []).length) out.push(`💬 ${ai.dialogue.slice(0, 2).map(([sp, t]) => `${sp ? `<b>${esc(sp)}:</b> ` : ""}"${esc(t)}"`).join(" ")}`);
  const meta = [];
  if (ai.emotion) meta.push(`emotion ${ai.emotion}/10`);
  if (ai.intensity) meta.push(`action ${ai.intensity}/10`);
  if (ai.formats && ai.formats.length) meta.push(ai.formats.map(f => FORMAT_LABEL[f] || f).join(" · "));
  if (ai.payoff_seen === false && (ai.formats || []).length) meta.push("no clear payoff");
  if (ai.visual && ai.visual !== "good") meta.push(`picture: ${ai.visual}`);
  if (h.audio && h.audio.speech_share > 0.3) meta.push(`speech ${Math.round(h.audio.speech_share * 100)}%`);
  if (h.story) meta.push("part of a story");
  if (meta.length) out.push(`<span class="muted">${esc(meta.join(" · "))}</span>`);
  return out.length ? `<div class="small" style="margin-top:4px">${out.join("<br>")}</div>` : "";
}

}

function toggleStyle(k, el) { state.styles.has(k) ? state.styles.delete(k) : state.styles.add(k); el.classList.toggle("on"); }

const LEN_OPTS = [["", "Auto"], ["15", "up to 15 s"], ["20", "up to 20 s"], ["30", "up to 30 s"], ["45", "up to 45 s"], ["58", "up to 58 s (under 1 min)"], ["90", "up to 90 s"], ["custom", "Custom…"]];
const LEN_AUTO = { hype: "Auto: the whole moment", meme: "Auto: ~20 s", cinematic: "Auto: ~20 s" };
function lengthPicker(k) {
  const v = localStorage.getItem("cf_len_" + k) || "", c = localStorage.getItem("cf_lenc_" + k) || "25";
  return `<div class="row small" style="margin-top:8px;gap:6px" onclick="event.stopPropagation()" title="${LEN_AUTO[k] || "Auto"}. A limit: each Short keeps the length its moment needs, and only longer moments are cut down.">Max length
    <select id="slen-${k}" style="width:auto;padding:4px 6px" onchange="localStorage.setItem('cf_len_${k}', this.value); $('#slenc-${k}').hidden = this.value !== 'custom'">
      ${LEN_OPTS.map(([x, l]) => `<option value="${x}" ${x === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    <input type="number" id="slenc-${k}" min="5" max="180" step="1" style="width:62px;padding:4px 6px" value="${esc(c)}" ${v === "custom" ? "" : "hidden"}
      onchange="localStorage.setItem('cf_lenc_${k}', this.value)"></div>`;
}
function shortLengths() {
  const out = {};
  for (const k of Object.keys(STYLE_INFO)) {
    const v = $("#slen-" + k)?.value;
    const n = !v ? null : v === "custom" ? +$("#slenc-" + k).value : +v;
    out[k] = n >= 5 && n <= 180 ? n : null;
  }
  return out;
}

async function makeShorts() {
  const game = $("#game").value.trim(); localStorage.setItem("cf_game", game);
  try {
    await api(`/v1/projects/${state.project.id}/shorts`, { method: "POST", body: {
      styles: [...state.styles], top: +$("#top").value || 4, game: game || null,
      include_maybe: $("#maybe").checked, plain: $("#plain").checked, lengths: shortLengths(),
      caption_bar: $("#cbar").checked ? true : null } });
    state.styleFilter = "old"; localStorage.setItem("cf_style_filter", "old");
    state._shortsBusy = true; setTab("shorts"); toast("Making your Shorts…");
  } catch (e) { toast("Error: " + e.message); }
}

async function renderShorts() {
  const body = $("#tabbody"); if (!body) return;
  const s = await api(`/v1/projects/${state.project.id}/shorts`);
  const b = s.batch;
  const making = s.shorts.filter(c => c.music.work && c.music.work.busy).length;
  state._shortsBusy = !!(b && b.running) || s.rendering > 0 || making > 0;
  let head = "";
  $("#tn-shorts") && ($("#tn-shorts").textContent = s.shorts.filter(c => c.plan).length || "");
  if (b && b.error) head = `<div class="card row"><div class="grow"><b class="err">Making Shorts failed</b><div class="small err">${esc(b.error)}</div></div><button onclick="setTab('make')">${ic("refresh")} Try again</button></div>`;
  else if (state._shortsBusy) {
    const pct = s.progress.length ? Math.round(s.progress.reduce((a, p) => a + p.progress, 0) / s.progress.length * 100) : 0;
    head = `<div class="card"><div class="row"><span class="spin"></span> <b>${b && b.running ? esc(b.step) : s.rendering ? `Rendering ${s.rendering} Short${s.rendering > 1 ? "s" : ""}… ${pct}%` : `Making music for ${making} Short${making > 1 ? "s" : ""}… the first one after a restart can take a few minutes while the AI music model loads`}</b>
</div>
      ${pct ? `<div class="overall" style="margin-top:10px"><i style="width:${pct}%"></i></div>` : ""}<div class="muted small" style="margin-top:6px">New Shorts appear below as they finish.</div></div>`;
  } else if (b && b.folder) {
    head = `<div class="row small muted" style="margin-bottom:12px"><span class="grow">${ic("check")} Saved to <b style="color:var(--text)">${esc(b.folder)}</b>, each with a .txt of its title, description and hashtags</span>
      <button class="small" data-path="${esc(b.folder)}" onclick="openFolder(this.dataset.path)">${ic("folder")} Open folder</button></div>`;
  }
  const filter = state.styleFilter === "old" && !s.shorts.some(c => !c.plan) ? "stories" : state.styleFilter;
  const visible = s.shorts.filter(c => shortIn(c, filter));
  const ratingsP = api(`/v1/projects/${state.project.id}/ratings`);
  const shown = new Set([...body.querySelectorAll(".short")].map(e => e.dataset.key));
  const keys = visible.map(c => c.id + ":" + c.modified);
  const sameFilter = body.dataset.filter === filter && body.dataset.total === String(s.shorts.length);
  if (state._editing || (sameFilter && keys.length === shown.size && keys.every(k => shown.has(k)))) { $("#shortsHead") && ($("#shortsHead").innerHTML = head); return; }
  const ratings = await ratingsP;
  await loadMusic().catch(() => null);
  body.dataset.filter = filter; body.dataset.total = String(s.shorts.length);
  const bar = s.shorts.length ? filterBar(s.shorts) : "";
  let list;
  if (visible.length) list = `<div class="shorts">${visible.map(c => shortCard(c, ratings[c.candidate_id])).join("")}</div>`;
  else if (state._shortsBusy) list = "";
  else list = `<div class="empty"><b>No ${s.shorts.length ? "new " : ""}Shorts yet</b>Pick the ones worth making and SPHURA cuts them.<div class="row"><button class="primary" onclick="setTab('make')">${ic("scissors")} Make Shorts</button></div></div>`;
  body.innerHTML = `<div id="shortsHead">${head}</div>${bar}${list}`;
}

// Format Shorts have their own tab; the style tabs show the plain Shorts
// New (planned, one-beat) Shorts by default; everything made the old way sits under "Old"
function shortIn(c, k) {
  if (k === "all") return true;
  if (k === "stories") return !!c.plan;
  if (k === "old") return !c.plan;
  return !c.plan && (k === "formats" ? !!c.trend : !c.trend && c.style === k);
}
function filterBar(all) {
  const count = k => all.filter(c => shortIn(c, k)).length;
  if (!count("old")) return "";
  const opts = [["stories", "New"], ["old", "Older"]];
  return `<div class="filters">${opts.map(([k, label]) => `
    <button class="chip ${state.styleFilter === k ? "on" : ""}" onclick="setStyleFilter('${k}')">${label} <span>${count(k)}</span></button>`).join("")}</div>`;
}
function setStyleFilter(k) {
  state.styleFilter = k; localStorage.setItem("cf_style_filter", k);
  $("#tabbody").dataset.filter = ""; renderShorts();
}

function planBadge(c) {
  // Which version of which planned Short this is; the why and the cut live in the tooltip
  const p = c.plan, st = (p.structure || []).map(x => `${x.role} ${hms(x.start_s)}–${hms(x.end_s)}: ${x.why}`).join("\n");
  return `<span class="badge b-viral" title="${esc(p.reason)}\n\n${esc(st)}">${esc(p.format_label)}</span>
    <span class="badge ${c.chosen ? "b-lic" : ""}" title="${esc(p.about)}">${esc(p.variant)} · ${esc(p.label)}${c.chosen ? " ✓" : ""}</span>`;
}

let musicCache = null;
async function loadMusic(force) { if (!musicCache || force) musicCache = await api("/v1/music"); return musicCache; }

async function showMusic() {
  if (!edLeaveOk()) return;

const RL_BUSY = ["analysing", "picking", "rendering"];

async function openReel(id, step) {

function rlAutoStep() {
  return { importing: 1, analysing: 2, picking: 2, review: 3, rendering: 5, done: 6 }[RL.r.status] || 1;
}
function rlPoll() {
  rlStop();
  if (!RL_BUSY.includes(RL.r.status)) return;
  RL.timer = setTimeout(async () => {
    if (!$("#rlbody") || !RL.r) return;
    const before = RL.r.status;
    try { RL.r = await api(`/v1/reels/${RL.r.id}`); } catch { return rlPoll(); }
    if (RL.r.status !== before) { RL.step = rlAutoStep(); rlRender(); } else rlBody();

}
async function rlCall(path, body, method = "POST") {

  catch (e) { toast(e.message); return false; }

function rlRender() {
  const r = RL.r, busy = RL_BUSY.includes(r.status), hasM = r.moments.length > 0;
  const can = [!busy, r.status === "analysing" || r.status === "picking", !busy && hasM, !busy && hasM, r.status === "rendering", !!r.output && !busy];
  const done = [r.sources.length > 0, hasM, hasM && r.picks_edited, false, !!r.output, false];
  $("#main").innerHTML = `
    <div class="row"><button onclick="showReels()">← All reels</button>

    <div class="rlsteps">${RL_STEPS.map((t, i) => `<div class="rlstep ${RL.step === i + 1 ? "on" : ""} ${done[i] && RL.step !== i + 1 ? "done" : ""} ${can[i] && RL.step !== i + 1 ? "click" : ""}"
      ${can[i] ? `onclick="RL.step=${i + 1};rlRender()"` : ""}><b>Step ${i + 1}</b>${t}</div>`).join("")}</div>
    ${r.render?.error && !busy ? `<div class="card err">${r.render.error === "Cancelled" ? "Generating was cancelled." : esc(r.render.error)}</div>` : ""}
    <div id="rlbody"></div>`;

}

// Step 3: review
function rlTrim(m) {
  const cap = RL.r.clip_cap_s, len = m.end_s - m.start_s;
  if (len <= cap) return [m.start_s, m.end_s];
  if (m.finale) return [m.end_s - cap, m.end_s];
  const a = Math.max(m.start_s, Math.min(m.peak_s - 0.6 * cap, m.peak_s + 1.5 - cap, m.end_s - cap));
  return [+a.toFixed(2), +(a + cap).toFixed(2)];
}
function rlThumb(m) { return `/v1/reels/${RL.r.id}/moments/${encodeURIComponent(m.id)}/thumb.jpg`; }

    <span id="rlcust" ${custom ? "" : "hidden"}><input type="number" min="10" max="600" style="width:70px" value="${t}" onchange="rlSet({target_s:+this.value})"> s</span></label>`;
}

async function rlSet(settings) { if (await rlCall("", { settings }, "PATCH")) rlBody(); }

function rlSavePicks(redraw = true) {
  // Picks are saved as edited; a short pause batches quick changes
  clearTimeout(RL.save);
  return new Promise(ok => { RL.save = setTimeout(async () => { if (await rlCall("", { picks: RL.r.picks }, "PATCH") && redraw) rlBody(); ok(); }, 250); });
}
function rlToggle(id, on) {
  const p = RL.r.picks.find(x => x.moment_id === id);
  if (p) p.include = on;
  else if (on) { const m = RL.r.moments.find(x => x.id === id), [a, b] = rlTrim(m); RL.r.picks.push({ moment_id: id, start_s: a, end_s: b, include: true }); }
  rlSavePicks();
}
function rlEditPick(id, key, v) {
  const p = RL.r.picks.find(x => x.moment_id === id); if (!p) return;
  p[key] = Math.max(0, +v);
  if (p.end_s - p.start_s < 1) { if (key === "start_s") p.start_s = p.end_s - 1; else p.end_s = p.start_s + 1; }
  rlSavePicks();
}
function rlNudge(id, key, d) { const p = RL.r.picks.find(x => x.moment_id === id); if (p) rlEditPick(id, key, p[key] + d); }
function rlMovePick(id, d) {
  const inc = RL.r.picks.filter(p => p.include), i = inc.findIndex(p => p.moment_id === id), j = i + d;
  if (i < 0 || j < 0 || j >= inc.length) return;
  [inc[i], inc[j]] = [inc[j], inc[i]];
  RL.r.picks = [...inc, ...RL.r.picks.filter(p => !p.include)];
  rlSavePicks();
}

function rlPlaySeq(from) {

    if (!RL.seq || i >= seq.length) { rlStopSeq(); return; }
    RL.seq.i = i; const p = seq[i], m = byId[p.moment_id], src = `/v1/reels/${RL.r.id}/sources/${m.source_id}/video`;

// ---------- Lore Studio ----------
const LS = { game: localStorage.getItem("sphura_lore_game") || "", tab: "ideas", cat: "all", sort: "best", sel: null, open: null, timer: null, ov: null, lib: [], ideas: null };
const LORE_CAT = { hidden: "Hidden details", lore: "Lore explained", moment: "Story moments", facts: "Facts", foreshadow: "Foreshadowing", character: "Character", myth: "Myth vs game" };
const LORE_KIND = { canon: "Canon", quote: "In-game quote", trivia: "Trivia", myth: "Mythology", theory: "Fan theory" };
const LORE_STATUS = { not_indexed: "Not indexed", queued: "Queued", indexing: "Indexing", indexed: "Indexed", failed: "Failed", paused: "Paused", stale: "Needs re-index" };
const LORE_STAGE = { waiting: "Waiting for the highlight analysis", extract_audio: "Reading the audio", transcribe: "Transcribing speech", frames: "Looking at the footage", scenes: "Building scenes" };

async function showLore(tab) {
  if (!edLeaveOk()) return;
  nav("lore");
  stopPolling(); leaveDownloads(); rlStop(); state.project = null; loadProjects();
  if (tab) LS.tab = tab;
  history.replaceState(null, "", "#lore");
  $("#main").innerHTML = `<div class="card"><span class="spin"></span> Opening Lore Studio…</div>`;
  await loreLoad();
}
async function loreLoad() {
  clearTimeout(LS.timer);
  try {
    [LS.ov, LS.lib] = await Promise.all([api("/v1/lore"), api("/v1/lore/library")]);
    if (!LS.ov.games.some(g => g.key === LS.game)) LS.game = LS.ov.games[0]?.key || "";
    LS.ideas = LS.game ? await api(`/v1/lore/${LS.game}/ideas`) : null;
  } catch (e) {
    $("#main").innerHTML = `<div class="empty"><b>Lore Studio couldn't load</b><span class="err">${esc(e.message)}</span><div class="row"><button onclick="loreLoad()">${ic("refresh")} Try again</button></div></div>`;
    return;
  }
  if (!$("#lorebody")) loreShell(); else loreHead();
  loreBody();
  const busy = LS.lib.some(v => ["queued", "indexing"].includes(v.status)) || LS.ideas?.run?.status === "running";
  if (busy && location.hash === "#lore") LS.timer = setTimeout(loreLoad, 2500);
}
function loreShell() {
  $("#main").innerHTML = `
    <div class="pagehead"><div class="grow"><h1>Lore Studio</h1><div class="sub">Stories, lore and hidden details, found in your own footage and backed by sources.</div></div>
      <div class="row" id="loregames"></div></div>
    <div id="lorewarn"></div>

}
function loreHead() {

function loreGame(k) { LS.game = k; localStorage.setItem("sphura_lore_game", k); LS.sel = null; LS.open = null; loreLoad(); }
function loreTab(t) { LS.tab = t; loreHead(); loreBody(); }
function loreVideos() { return LS.lib.filter(v => v.game === LS.game); }
function loreBody() {
  const el = $("#lorebody"); if (!el) return;
  if (!LS.ov.games.length) {
    el.innerHTML = `<div class="empty"><b>No game footage yet</b>Lore Studio works with God of War Ragnarök and Phantom Blade Zero recordings. Add a stream or download one first.
      <div class="row"><button class="primary" onclick="showNew()">${ic("plus")} New stream</button><button onclick="showDownloads('queue')">${ic("download")} Downloads</button></div></div>`;

  }
