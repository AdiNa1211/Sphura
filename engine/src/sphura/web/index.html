// Ideas: discovery first
function loreIdeas(el) {
  const vids = loreVideos(), indexed = vids.filter(v => v.status === "indexed");
  const busy = vids.filter(v => ["queued", "indexing"].includes(v.status));
  const run = LS.ideas?.run, ideas = LS.ideas?.ideas || [];
  if (!indexed.length) {
    el.innerHTML = `<div class="empty"><b>${busy.length ? "Indexing your footage" : "Index your footage first"}</b>
      ${busy.length ? `${busy.length} video${busy.length > 1 ? "s are" : " is"} being indexed. Story ideas can be found as soon as one finishes.` : "SPHURA watches each video once: who is on screen, where, what is said. Then it can match stories to scenes you actually have."}
      <div class="row">${busy.length ? `<button onclick="loreTab('footage')">See progress</button>` : `<button class="primary" onclick="loreTab('footage')">${ic("video")} Choose footage</button>`}</div></div>`;
    return;
  }
  const sel = loreSel();
  const counts = {}; ideas.forEach(i => counts[i.category] = (counts[i.category] || 0) + 1);
  const shown = ideas.filter(i => LS.cat === "all" || i.category === LS.cat).sort(LORE_SORT[LS.sort]);
  const runBox = run && run.status === "running"
    ? `<div class="card"><div class="row"><span class="spin"></span><b>${esc(run.step)}</b><span class="grow"></span><span class="small muted">${Math.round(run.progress * 100)}%</span></div>
        <div class="overall" style="margin-top:10px"><i style="width:${run.progress * 100}%"></i></div>
        <div class="small muted" style="margin-top:6px">Reading wiki pages for the characters in your footage, then matching stories to your scenes. A few minutes.</div></div>`
    : run && run.status === "failed" ? `<div class="card row"><div class="grow"><b class="err">Discovery failed</b><div class="small err">${esc(run.error || "")}</div></div><button onclick="loreDiscover()">${ic("refresh")} Try again</button></div>` : "";
  const bar = `<div class="row" style="margin-bottom:12px">
      <div class="filters" style="margin:0">${[["all", "All", ideas.length], ...Object.entries(LORE_CAT).filter(([k]) => counts[k]).map(([k, l]) => [k, l, counts[k]])]
        .map(([k, l, n]) => `<button class="chip ${LS.cat === k ? "on" : ""}" onclick="LS.cat='${k}';loreBody()">${l} <span>${n}</span></button>`).join("")}</div>
      <span class="grow"></span>
      ${ideas.length ? `<select style="width:auto" onchange="LS.sort=this.value;loreBody()" title="Sort ideas">${Object.entries({ best: "Best overall", confidence: "Footage match", fresh: "Unused footage", short: "Shortest first" }).map(([k, l]) => `<option value="${k}" ${LS.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select>` : ""}
      <button class="${ideas.length ? "" : "primary"}" onclick="loreDiscover()" ${run?.status === "running" ? "disabled" : ""} title="Uses ${sel.length} indexed video${sel.length === 1 ? "" : "s"}; choose them under Footage">${ic("spark")} ${ideas.length ? "Find new ideas" : "Discover story ideas"}</button></div>`;
  const list = shown.length ? `<div class="ideas">${shown.map(loreCard).join("")}</div>`
    : ideas.length ? `<div class="empty">No ideas in this category.</div>`
    : run?.status === "running" ? "" : `<div class="empty"><b>Ready to discover</b>${indexed.length} indexed video${indexed.length > 1 ? "s" : ""} with ${indexed.reduce((a, v) => a + (v.summary?.scenes || 0), 0)} scenes. SPHURA will research the characters and places in them and pitch stories your footage can show.</div>`;
  el.innerHTML = runBox + bar + list + (busy.length ? `<div class="small muted" style="margin-top:12px">${busy.length} more video${busy.length > 1 ? "s" : ""} indexing. Run discovery again when they finish to include them.</div>` : "");
}
const LORE_SORT = {
  best: (a, b) => b.score - a.score, confidence: (a, b) => b.confidence - a.confidence,
  fresh: (a, b) => b.fresh - a.fresh || b.score - a.score, short: (a, b) => a.seconds - b.seconds,
};
function loreSel() {
  const ids = loreVideos().filter(v => v.status === "indexed").map(v => v.asset_id);
  return LS.sel ? ids.filter(i => LS.sel.has(i)) : ids;
}
async function loreDiscover() {
  try { await api(`/v1/lore/${LS.game}/discover`, { method: "POST", body: { asset_ids: loreSel() } }); LS.tab = "ideas"; loreLoad(); }
  catch (e) { toast(e.message); }
}
function loreConf(i) {
  const pct = Math.round(i.confidence * 100), col = i.level === "high" ? "var(--good)" : i.level === "medium" ? "var(--accent2)" : "var(--bad)";
  const tip = `Footage match ${Math.round(i.footage_fit * 100)}%: how many story beats your scenes can show.\nSources ${Math.round(i.sourced * 100)}%: beats backed by canon or myth (fan theories count less).`;
  return `<span class="conf" title="${esc(tip)}"><i style="--w:${pct}%;--c:${col}"></i>${i.level[0].toUpperCase() + i.level.slice(1)} match · ${pct}%</span>`;
}
function loreCard(i) {
  const S = LS.ideas.scenes, P = LS.ideas.passages;
  const fmt = { short: "Short", long: "Long video", both: "Short or long" }[i.format];
  const len = i.seconds >= 120 ? `~${Math.round(i.seconds / 60)} min` : `~${i.seconds} s`;
  const kinds = {}; i.passages.forEach(p => { const k = P[p]?.kind; if (k) kinds[k] = (kinds[k] || 0) + 1; });
  const scenes = i.scenes.map(id => S[id]).filter(Boolean);
  const open = LS.open === i.id;
  return `<div class="idea">
    <div class="row" style="gap:6px"><span class="badge b-viral">${esc(LORE_CAT[i.category] || i.category)}</span><span class="badge">${fmt} · ${len}</span>
      ${i.theory ? `<span class="badge b-warn" title="Uses a fan theory: it will be labelled as one">Theory</span>` : ""}<span class="grow"></span>${loreConf(i)}</div>
    <div class="t">${esc(i.title)}</div>
    <div class="small muted">${esc(i.pitch)}</div>
    ${i.why ? `<div class="small faint">Why viewers care: ${esc(i.why)}</div>` : ""}
    <div class="strip">${scenes.slice(0, 4).map(s => loreThumb(s)).join("")}${scenes.length > 4 ? `<div class="more small muted">+${scenes.length - 4}</div>` : ""}</div>
    ${i.missing?.length ? `<div class="small" style="color:var(--accent2)">No clear footage for: ${i.missing.map(esc).join("; ")}</div>` : ""}
    <div class="row small muted" style="gap:10px">
      <span>${i.beats.length} beats · ${i.passages.length} source${i.passages.length === 1 ? "" : "s"}${Object.keys(kinds).length ? ` (${Object.entries(kinds).map(([k, n]) => `${n} ${(LORE_KIND[k] || k).toLowerCase()}`).join(", ")})` : ""}</span>
      ${i.appeal?.n ? `<span title="From public YouTube Shorts of this game. Shows interest, can't promise views.">· ${esc(i.appeal.basis)}</span>` : ""}
      <span class="grow"></span><button class="ghost small" onclick="LS.open=LS.open==='${i.id}'?null:'${i.id}';loreBody()">${open ? "Hide" : "Story & sources"}</button></div>
    ${open ? loreOutline(i) : ""}
  </div>`;
}
function loreThumb(s, big) {
  return `<div class="sthumb ${big ? "big" : ""}" onclick="lorePreview('${s.id}')" title="${esc(`${s.video || ""}\n${hms(s.start_s)}–${hms(s.end_s)} · ${s.kind}${s.characters.length ? " · " + s.characters.join(", ") : ""}`)}">
    <img loading="lazy" src="/v1/lore/frame.jpg?asset=${s.asset_id}&t=${Math.round((s.start_s + s.end_s) / 2)}" alt="">
    <span>${hms(s.start_s)}</span>${s.kind === "cinematic" ? `<em>cutscene</em>` : ""}</div>`;
}
function loreOutline(i) {
  const S = LS.ideas.scenes, P = LS.ideas.passages, num = Object.fromEntries(i.passages.map((p, k) => [p, k + 1]));
  return `<div class="outline">
    <ol>${i.beats.map(b => `<li><div>${esc(b.says)} ${b.sources.map(p => `<sup title="${esc(P[p]?.text || "")}">[${num[p]}]</sup>`).join("")}</div>
      <div class="small faint">${b.scenes.length ? `Shows: ${b.scenes.map(id => S[id] ? `<a href="#" onclick="lorePreview('${id}');return false">${hms(S[id].start_s)}</a>` : "").join(", ")}${b.fit < 1 ? " (closest match)" : ""}` : `<span style="color:var(--accent2)">No scene shows this yet</span>`} · ${esc(b.shows)}</div></li>`).join("")}</ol>
    <div class="srcs">${i.passages.map(p => P[p]).filter(Boolean).map(p => `<div class="src"><b>[${num[p.id]}]</b>
      <span class="badge ${p.kind === "theory" ? "b-warn" : p.kind === "myth" ? "b-strong" : ""}">${LORE_KIND[p.kind] || p.kind}</span>
      <span>${esc(p.text)}</span><div class="faint"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.site)}: ${esc(p.page)}</a> › ${esc(p.section)} · ${esc(p.license)}</div></div>`).join("")}</div>
  </div>`;
}
function lorePreview(id, scene) {
  const s = scene || LS.ideas?.scenes[id] || LS._scenes?.[id]; if (!s) return;
  const box = document.createElement("div"); box.className = "rlmodal";
  box.innerHTML = `<div class="box" style="width:min(1100px,94vw)"><div class="row" style="margin-bottom:10px"><b class="grow">${esc(s.video || "")} · ${hms(s.start_s)}–${hms(s.end_s)}</b><button class="ghost icon" data-tip="Close (Esc)">${ic("x")}</button></div>
    <div class="lprev"><video playsinline controls autoplay src="/v1/lore/videos/${s.asset_id}/source"></video>
    <div class="small"><div><span class="badge">${esc(s.kind)}</span></div>
      ${s.characters.length ? `<div style="margin-top:8px"><span class="muted">Characters</span><br>${esc(s.characters.join(", "))}</div>` : ""}
      ${s.location ? `<div style="margin-top:8px"><span class="muted">Place</span><br>${esc(s.location)}</div>` : ""}
      ${s.objects?.length ? `<div style="margin-top:8px"><span class="muted">Objects</span><br>${esc(s.objects.join(", "))}</div>` : ""}
      ${s.dialogue?.length ? `<div style="margin-top:8px"><span class="muted">Said</span>${s.dialogue.slice(0, 8).map(d => `<div class="faint" style="margin-top:3px">${hms(d.t)} <span style="color:var(--text)">${esc(d.text)}</span></div>`).join("")}</div>` : ""}
    </div></div></div>`;
  const close = () => { box.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = e => e.key === "Escape" && close();
  box.onclick = e => { if (e.target === box || e.target.closest("button")) close(); };
  document.addEventListener("keydown", esc_);
  document.body.appendChild(box);
  const v = box.querySelector("video");
  v.onloadedmetadata = () => { v.currentTime = s.start_s; };
  v.ontimeupdate = () => { if (v.currentTime > s.end_s + 0.3) v.pause(); };
  v.onerror = () => { box.querySelector(".lprev").insertAdjacentHTML("afterbegin", `<div class="err small">Can't play the recording: it may have been moved or deleted.</div>`); };
}

// Footage: what SPHURA can use, and its index status
function loreFootage(el) {
  const vids = loreVideos(), todo = vids.filter(v => ["not_indexed", "failed", "paused", "stale"].includes(v.status));
  const sel = new Set(loreSel());
  el.innerHTML = `<div class="row" style="margin-bottom:12px"><div class="grow small muted">Each video is watched once (a frame every 10 s plus the speech) and kept, so discovery never re-reads it. About 20–30 min per hour of footage, in the background; you can close SPHURA and it resumes.</div>
      ${todo.length ? `<button class="primary" onclick="loreIndex(${esc(JSON.stringify(todo.map(v => v.key)))})">${ic("layers")} Index ${todo.length === vids.length ? "all" : todo.length} video${todo.length > 1 ? "s" : ""}</button>` : ""}</div>
    <div class="lib">${vids.map(v => loreRow(v, sel)).join("")}</div>`;
}
function loreRow(v, sel) {
  const pct = Math.round((v.progress || 0) * 100), s = v.summary || {};
  let status;
  if (v.status === "indexed") status = `<span class="small"><span style="color:var(--good)">${ic("check")}</span> ${s.scenes} scenes${s.characters?.length ? ` · ${esc(s.characters.slice(0, 4).join(", "))}` : ""}</span>`;
  else if (v.status === "indexing" || v.status === "queued") status = `<div style="min-width:220px"><div class="small">${v.status === "queued" ? "Queued" : `${esc(LORE_STAGE[v.stage] || "Indexing")} · ${pct}%`}</div><div class="overall" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>`;
  else if (v.status === "failed") status = `<span class="small err" title="${esc(v.error || "")}">Failed: ${esc((v.error || "").replace(/^\w+Error: /, "").slice(0, 80))}</span>`;
  else status = `<span class="small muted">${LORE_STATUS[v.status]}</span>`;
  const act = ["indexing", "queued"].includes(v.status) ? `<button class="ghost small" onclick="loreCancel('${v.project_id}')">${ic("pause")} Pause</button>`
    : v.status === "indexed" ? `<button class="ghost small" onclick="loreScenes('${v.asset_id}')">${LS.openVid === v.asset_id ? "Hide scenes" : "Scenes"}</button>`
    : `<button class="small" onclick="loreIndex(['${v.key}'])">${v.status === "paused" ? "Resume" : v.status === "failed" ? "Retry" : v.status === "stale" ? "Re-index" : "Index"}</button>`;
  return `<div class="lrow">
    ${v.status === "indexed" ? `<input type="checkbox" title="Use in discovery" ${sel.has(v.asset_id) ? "checked" : ""} onchange="loreToggle('${v.asset_id}',this.checked)">` : `<span style="width:13px"></span>`}
    <img src="${esc(v.thumb)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">
    <div class="grow" style="min-width:0"><div class="name">${esc(v.title)}</div><div class="small faint">${hms(v.duration_s || 0)}${v.download_id && !v.project_id ? " · downloaded, not opened yet" : ""}</div></div>
    ${status}${act}</div>
    ${LS.openVid === v.asset_id ? `<div class="scenegrid" id="sg-${v.asset_id}"><span class="spin"></span></div>` : ""}`;
}
function loreToggle(id, on) {
  LS.sel = LS.sel || new Set(loreSel()); LS.sel[on ? "add" : "delete"](id);
}
async function loreIndex(keys) {
  try { const r = await api("/v1/lore/index", { method: "POST", body: { keys } }); toast(r.length ? `Indexing ${r.length} video${r.length > 1 ? "s" : ""}` : "Already indexed"); loreLoad(); }

// ---------- Voice quality report ----------
const VQ_KIND = { identity: "Speaker", timbre: "Voice colour", pitch: "Pitch", loudness: "Loudness", rate: "Pace", boundary: "Join", pause: "Pause", artifact: "Artifact" };
const VQ_NAME = { ok: ["Heard right", "var(--good)"], check: ["Close, check it", "var(--accent2)"], suspect: ["Sounds different", "var(--bad)"], unclear: ["Not clear", "var(--muted)"] };
function vqReport(r, clip) {
  const m = r.measured, rec = r.recognised, sc = m.consistency_score;
  const lineOf = seg => r.lines[+String(seg).split(".")[0]] || {};
  const flaggedLines = new Set([...m.flags.map(f => lineOf(f.segment).index), ...rec.warnings.map(n => n.line), ...r.estimates.map(e => r.lines[e.line]?.index)]);
  const col = sc == null ? "var(--muted)" : sc >= 85 ? "var(--good)" : sc >= 65 ? "var(--accent2)" : "var(--bad)";
  const names = r.lines.flatMap((ln, li) => (ln.names || []).map(n => ({ ...n, li, index: ln.index })));
  const warn = names.filter(n => n.status !== "ok");
  return `<div class="row"><h3 class="grow">Voice quality</h3>${clip ? `<button class="ghost small" onclick="vqClip('${clip}', true)">${ic("refresh")} Check again</button>` : ""}</div>
    <div class="vqsec"><div class="faint small">Measured from the audio</div>
      <div class="vqstats"><div><div class="faint small">Consistency</div><b style="color:${col}">${sc ?? "—"}</b><span class="faint small">/100</span></div>
        <div><div class="faint small">Same speaker</div><b>${m.identity == null ? "—" : m.identity.toFixed(2)}</b></div>
        <div><div class="faint small">Loudness spread</div><b>${m.loudness_spread_lu ?? 0}</b> <span class="faint small">LU</span></div>
        <div><div class="faint small">Clipping</div><b style="color:${m.clipping ? "var(--bad)" : "inherit"}">${m.clipping}</b></div></div>
      ${m.identity == null ? `<div class="small faint" style="margin-top:4px">${r.lines.length < 2 && m.segments.length < 2 ? "Same-speaker check needs two or more pieces." : "Speaker model not available yet: it downloads on first use (26 MB)."}</div>` : ""}
      ${m.flags.length ? m.flags.map(f => `<div class="vqflag"><span class="k">${VQ_KIND[f.kind] || esc(f.kind)}</span><span>${esc(f.message)} <span class="faint">· ${esc(f.label)}</span></span></div>`).join("") : `<div class="small" style="color:var(--good);margin-top:6px">${ic("check")} Nothing outside the thresholds</div>`}</div>
    <div class="vqsec"><div class="faint small">Names, by speech recognition (can mishear correct fictional names)</div>
      ${!rec.checked ? `<div class="small muted">${esc(rec.error || "Off: turn on “Listen back for names” in Voice style.")}</div>`
        : !names.length ? `<div class="small muted">No dictionary names in this script.</div>`
        : `${warn.length ? "" : `<div class="small" style="color:var(--good)">${ic("check")} ${names.length} name${names.length > 1 ? "s" : ""} heard as expected</div>`}
          ${warn.map(n => `<div class="vqname"><b>${esc(n.term)}</b><span style="color:${VQ_NAME[n.status][1]}">${VQ_NAME[n.status][0]}</span>
            <span class="muted">heard “${esc(n.heard || "…")}” · expected “${esc(n.expected)}” · ${Math.round(n.score * 100)}%</span><span class="grow"></span>
            ${n.heard && r.game ? `<button class="small" title="It was said right; recognition just writes it this way. Stops this warning." onclick="vqHeard(this, '${r.game}', '${n.id}', '${esc(n.heard)}', '${clip || ""}')">It sounds right</button>` : ""}
            ${r.game ? `<button class="small" onclick="vqVariants(this, '${r.game}', '${esc(n.term)}', '${n.id}', '${esc(r.voice)}')">Try spellings</button>` : ""}
            ${clip ? `<button class="small" onclick="vqRegen(this, '${clip}', ${n.index})">${ic("refresh")} Redo line</button>` : ""}</div>`).join("")}`}</div>
    ${r.estimates.length ? `<div class="vqsec"><div class="faint small">Worth a listen (rules of thumb, not measurements)</div>${r.estimates.map(e => `<div class="vqflag"><span class="k">${e.kind === "mood" ? "Mood" : "Short piece"}</span><span>${esc(e.message)} <span class="faint">· ${esc(r.lines[e.line]?.label || "")}</span></span></div>`).join("")}</div>` : ""}
    ${clip ? `<div class="vqsec"><div class="faint small">Lines · redo one without re-recording the rest</div><table class="vqtable"><tr><th>Line</th><th>Loudness</th><th>Length</th><th>Pieces</th><th></th></tr>
      ${r.lines.map(ln => ln.missing ? `<tr class="bad"><td>${esc(ln.label)} <span class="faint">audio missing</span></td><td></td><td></td><td></td><td><button class="small" onclick="vqRegen(this, '${clip}', ${ln.index})">${ic("refresh")} Redo</button></td></tr>`
        : `<tr class="${flaggedLines.has(ln.index) ? "bad" : ""}"><td><b>${esc(ln.label)}</b><div class="small faint">${esc((ln.text || "").slice(0, 90))}</div></td><td>${ln.lufs} LUFS</td><td>${ln.seconds}s</td><td>${ln.segments}</td>
          <td style="white-space:nowrap"><button class="ghost icon" data-tip="Listen" onclick="vqPlayLine(this, ${ln.index})">${ic("play")}</button><button class="small" title="A new take of this line only" onclick="vqRegen(this, '${clip}', ${ln.index})">${ic("refresh")} Redo</button></td></tr>`).join("")}</table></div>` : ""}
    <div class="small faint" style="margin-top:10px">These checks measure consistency and catch likely problems. They don't predict how natural it sounds or how a Short will perform: trust your ears.</div>`;
}
async function vqClip(id, refresh) {
  const el = $("#vq-" + id); if (!el) return;
  el.innerHTML = `<span class="spin"></span> <span class="small muted">Checking the recorded voice-over…</span>`;
  try { const r = await api(`/v1/clips/${id}/voiceover/report${refresh ? "?refresh=true" : ""}`); el.innerHTML = vqReport(r, id); el._report = r; }
  catch (e) { el.innerHTML = `<div class="small muted">Quality report unavailable: ${esc(e.message)}</div>`; }
}
async function vqRegen(btn, id, index) {
  const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>`;
  try {
    const r = await api(`/v1/clips/${id}/voiceover/lines/${index}/regenerate`, { method: "POST" });
    const el = $("#vq-" + id); if (el) { el.innerHTML = vqReport(r.report, id); el._report = r.report; }
    toast(`New take of line ${index + 1}. Re-rendering the Short…`);
  } catch (e) { toast(e.message); btn.disabled = false; btn.innerHTML = label; }
}
function vqPlayLine(btn, index) {
  const line = btn.closest("[data-voice-root]")?.querySelectorAll(".vo-line")[index];
  const play = line?.querySelector("button[title=Listen]");
  if (play) voPreview(play); else toast("Line not found in the editor");
}
async function vqHeard(btn, game, id, heard, clip) {

  } catch (e) { toast(e.message); btn.disabled = false; }
}
async function vqVariants(btn, game, name, id, voice) {
  const row = btn.closest(".vqname"); let box = row.nextElementSibling;
  if (box?.classList.contains("vqvar")) { box.remove(); return; }
  box = document.createElement("div"); box.className = "vqvar small"; box.style.cssText = "padding:6px 0 8px 12px";
  row.after(box); box.innerHTML = `<span class="spin"></span>`;
  try {
    const vs = await api(`/v1/voice/intel/${game}/variants?name=${encodeURIComponent(name)}`);
    box.innerHTML = `<span class="muted">Listen, then keep the one that sounds right:</span> ` + (vs.length ? vs.map(v => `<span style="white-space:nowrap;margin-right:10px"><button class="ghost icon" data-tip="Listen" onclick="viPlay(this, {voice:'${esc(voice)}', game:'${game}', text:'${esc(name)}. This is ${esc(name)}.', respell:{'${esc(name)}':'${esc(v)}'}})">${ic("play")}</button>${esc(v)} <button class="small" onclick="vqUse(this, '${game}', '${id}', '${esc(v)}')">Use</button></span>`).join("") : `<span class="faint">No other spellings to suggest. Edit it in Pronunciation.</span>`);
  } catch (e) { box.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
async function vqUse(btn, game, id, respell) {
  // Saves the full term with the new spelling so aliases and notes are kept
  try {
    const g = await api(`/v1/voice/intel/${game}`), t = g.terms.find(x => x.id === id);
    if (!t) throw new Error("Name not in the dictionary any more");
    await api(`/v1/voice/intel/${game}/terms`, { method: "POST", body: { ...t, respell, aliases: t.aliases.join(", "), nicknames: t.nicknames.join(", ") } });
    toast(`Saved: ${t.canonical} → ${respell}. Redo the line to hear it in the Short.`);
    btn.closest(".vqvar").innerHTML = `<span style="color:var(--good)">${ic("check")} Saved “${esc(respell)}”</span>`;
    if (VI.game === game) VI.game_data = g;
  } catch (e) { toast(e.message); }
}
async function viQA(btn) {
  const body = viBody("a"), el = $("#viqa");
  if (!voReady(body.voice)) { toast("Install this voice first (Shorts → Voice-over)"); return; }
  const label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Checking`;
  try { const r = await api("/v1/voice/qa/line", { method: "POST", body }); el.innerHTML = `<div class="vq">${vqReport(r)}</div>`; }
  catch (e) { el.innerHTML = `<div class="small err">${esc(e.message)}</div>`; }
  finally { btn.disabled = false; btn.innerHTML = label; }
}

// ---------- Benchmark ----------
const VB_COLS = [["latency_s", "Time per line", v => v + "s"], ["rtf", "Speed (RTF)", v => v + "×"], ["names_ok", "Names heard right", v => Math.round(v * 100) + "%"],
  ["consistency", "Same narrator", v => v.toFixed(2)], ["loudness_spread_lu", "Loudness spread", v => v + " LU"], ["clipping", "Clipping", v => v]];
async function vbShow() {
  clearTimeout(VI.bt);
  const el = $("#vibody"); if (!el) return;
  if (!VI.bench) el.innerHTML = `<span class="spin"></span>`;
  try { VI.bench = await api("/v1/voice/bench"); } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const B = VI.bench, runs = B.runs;
  const run = runs.find(r => r.id === VI.brun) || runs[0];
  VI.bsel = VI.bsel || Object.keys(B.engines).filter(k => B.engines[k].ready);
  el.innerHTML = `<div class="card"><h2>Compare voices</h2>
      <div class="small muted" style="margin-bottom:10px">Says the same ${B.scenes.length} scenes (emotional, boss fight, intro, lore, suspense, funny, action) with each engine, then measures them. Rate each sample while you listen: measurements can't tell you which sounds more natural. Everything runs on this PC, so there's no per-use cost.</div>
      <div class="row">${Object.entries(B.engines).map(([k, e]) => `<label class="small" style="display:flex;gap:6px;align-items:center;margin-right:12px;${e.ready ? "" : "opacity:.5"}"><input type="checkbox" ${VI.bsel.includes(k) ? "checked" : ""} ${e.ready ? "" : "disabled"} onchange="VI.bsel=[...document.querySelectorAll('.vbeng:checked')].map(x=>x.value)" class="vbeng" value="${k}">${esc(e.label)}${e.ready ? "" : " (not installed)"}</label>`).join("")}
        <span class="grow"></span>${runs.length > 1 ? `<select style="width:auto" onchange="VI.brun=this.value;vbShow()">${runs.map(r => `<option value="${r.id}" ${r.id === run?.id ? "selected" : ""}>${new Date(r.started_at).toLocaleString()} · ${r.engines.length} engine${r.engines.length > 1 ? "s" : ""}</option>`).join("")}</select>` : ""}
        <button class="primary" onclick="vbStart(this)" ${run?.status === "running" ? "disabled" : ""}>${ic("play")} Run benchmark</button></div>
      <div class="small faint" style="margin-top:6px">Qwen takes several minutes the first time (loading and designing the voices).</div></div>
    ${run ? vbRun(run, B) : `<div class="empty">No benchmark yet.</div>`}`;
  if (run?.status === "running" && VI.tab === "bench" && location.hash === "#voice") VI.bt = setTimeout(vbShow, 2000);
}
function vbRun(run, B) {
  const label = k => B.engines[k]?.label || k, sum = run.summary || {}, notes = run.notes || {};
  if (run.status === "running") return `<div class="card"><span class="spin"></span> ${esc(run.step)} · ${Math.round(run.progress * 100)}%<div class="conf" style="margin-top:8px"><i style="width:240px;--w:${Math.round(run.progress * 100)}%;--c:var(--accent)"></i></div></div>`;
  if (run.status === "failed") return `<div class="card err">Benchmark failed: ${esc(run.error)}</div>`;
  const engs = run.engines, scenes = B.scenes.filter(s => run.samples.some(x => x.scene === s.id));
  return `<div class="card"><h2>Results</h2><table class="vqtable"><tr><th>Engine</th>${VB_COLS.map(([k, l]) => `<th title="${esc(notes[k] || "")}">${l}</th>`).join("")}<th title="${esc(notes.rating || "")}">Your rating</th></tr>
      ${engs.map(e => { const s = sum[e] || {}; return `<tr><td><b>${esc(label(e))}</b></td>${VB_COLS.map(([k, , f]) => `<td>${s[k] == null ? `<span class="faint">—</span>` : f(s[k])}</td>`).join("")}<td>${s.rating == null ? `<span class="faint">not rated</span>` : `${s.rating} / 5 <span class="faint small">(${s.rated})</span>`}</td></tr>`; }).join("")}</table>
      <div class="small faint" style="margin-top:8px">Measured columns come from the audio; hover a heading for what it means. “Names heard right” is a lower bound, because recognition also mishears correct fictional names.</div></div>
    <div class="card"><h2>Listen and rate</h2><table class="vqtable vbgrid"><tr><th>Scene</th>${engs.map(e => `<th>${esc(label(e))}</th>`).join("")}</tr>
      ${scenes.map(sc => `<tr><td><b>${esc(sc.kind)}</b><div class="small faint" style="white-space:normal;max-width:280px">${esc(sc.text.replace(/\[[^\]]*\]\s*/g, "").slice(0, 110))}</div></td>${engs.map(e => { const x = run.samples.find(s => s.engine === e && s.scene === sc.id); return `<td>${x ? `<button class="ghost icon" data-tip="Listen" onclick="vbPlay('${run.id}','${x.file}')">${ic("play")}</button>
        <select style="width:auto" onchange="vbRate('${run.id}','${x.file}',this.value)"><option value="">Rate</option>${[1, 2, 3, 4, 5].map(n => `<option ${x.rating === n ? "selected" : ""}>${n}</option>`).join("")}</select>
        <div class="small faint">${x.latency_s}s · ${x.lufs} LUFS${x.clipping ? ` · <span style="color:var(--bad)">clips</span>` : ""}${x.names?.length ? ` · names ${x.names.filter(n => n.status === "ok").length}/${x.names.length}` : ""}</div>` : `<span class="faint">—</span>`}</td>`; }).join("")}</tr>`).join("")}</table></div>`;
}
async function vbStart(btn) {
  if (!VI.bsel?.length) { toast("Pick at least one installed engine"); return; }
  btn.disabled = true;
  try { const r = await api("/v1/voice/bench", { method: "POST", body: { engines: VI.bsel } }); VI.brun = r.id; vbShow(); } catch (e) { toast(e.message); btn.disabled = false; }
}
function vbPlay(run, file) { new Audio(`/v1/voice/bench/${run}/${encodeURIComponent(file)}`).play().catch(e => toast(e.message)); }
async function vbRate(run, file, score) {
  if (!score) return;
  try { await api(`/v1/voice/bench/${run}/rate`, { method: "POST", body: { file, score: +score } }); VI.brun = run; vbShow(); } catch (e) { toast(e.message); }
}

// Voice style
function viStyle() {
  const s = VI.data.settings, P = VI.data.personalities, prof = VI.game_data?.profile;
  const tog = (k, l, d) => `<label class="vtog"><input type="checkbox" ${s[k] ? "checked" : ""} onchange="viSet({${k}: this.checked})"><div><b>${l}</b><div class="small muted">${d}</div></div></label>`;
  const slider = (k, l, min, max, step) => `<label class="vsl"><span>${l}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${s[k]}" oninput="this.nextElementSibling.textContent=viShow('${k}',this.value)" onchange="viSet({${k}: +this.value})"><b>${viShow(k, s[k])}</b></label>`;
  $("#vibody").innerHTML = `<h2>Voice personality</h2>
    <div class="vpers">${[{ id: "auto", name: "Match the voice", suits: "Gamer voice → Gaming Hype, Storyteller → Cinematic", voice: "Picks a personality from the voice you choose for each Short" }, ...P].map(p => `
      <div class="vper ${s.personality === p.id ? "on" : ""}" onclick="viSet({personality:'${p.id}'})"><b>${esc(p.name)}</b><div class="small muted">${esc(p.suits)}</div>
        ${p.pace ? `<div class="small faint" style="margin-top:4px">pace ${p.pace}× · intensity ${Math.round(p.intensity * 100)}% · pauses ${p.pauses}×</div>` : ""}</div>`).join("")}</div>
    ${s.personality === "custom" ? `<div class="card" style="margin-top:12px"><label class="small muted">Describe the custom voice (Qwen designs it from this)</label>
      <textarea rows="2" style="width:100%;margin-top:4px" onchange="viSet({custom:{...VI.data.settings.custom, voice:this.value}})">${esc(s.custom?.voice || "")}</textarea>
      <label class="small muted" style="display:block;margin-top:8px">How scripts should read</label>
      <input type="text" style="width:100%" value="${esc(s.custom?.writer || "")}" onchange="viSet({custom:{...VI.data.settings.custom, writer:this.value}})"></div>` : ""}
    ${prof ? `<div class="row small" style="margin-top:12px"><span class="muted">Default for ${esc(prof.name)}:</span>
      <select style="width:auto" onchange="viProfile({personality:this.value})"><option value="auto">Use the setting above</option>${P.map(p => `<option value="${p.id}" ${prof.personality === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      <span class="faint">only used when the setting above is "Match the voice"</span></div>` : ""}
    <h2 style="margin-top:24px">Delivery</h2>
    <div class="vsls">${slider("speed", "Speaking speed", 0.7, 1.4, 0.05)}${slider("intensity", "Emotional intensity", 0, 1, 0.05)}${slider("pauses", "Pauses", 0.3, 2.5, 0.1)}</div>
    <h2 style="margin-top:24px">Narration</h2>
    <div class="vtogs">${tog("emotion", "Emotion-aware narration", "Each line gets a mood. Qwen says it from a reference recorded in that mood; Kokoro can't do moods.")}
      ${tog("scene_aware", "Scene-aware delivery", "Boss fights, sad scenes, lore and jokes each get their own pacing and tone.")}
      ${tog("pronunciation", "Pronunciation correction", "Names from the dictionary are said the way the game says them.")}
      ${tog("glossary", "Glossary lookup for scripts", "The script writer gets the correct spelling of the names in the scene.")}
      ${tog("optimize", "Natural speech", "Contractions, no AI clichés, short sentences; numbers and abbreviations said properly.")}</div>
    <h2 style="margin-top:24px">Realism</h2>
    <div class="vsls">${slider("transition_sensitivity", "Mood changes", 0, 1, 0.05)}
      <label class="vsl"><span>Audio clean-up</span><select style="grid-column:1/-1" onchange="viSet({enhance:this.value})">${[["off", "Off: raw voice"], ["light", "Light: even levels, gentle compression"], ["standard", "Standard: firmer compression, louder"]].map(([k, l]) => `<option value="${k}" ${s.enhance === k ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>
    <div class="small faint" style="margin:6px 0 10px">Mood changes: low keeps one delivery through a line (fewer switches, one narrator); high follows every [bracket] and mood shift. Qwen switches between recorded references; it can't blend two moods.</div>
    <div class="vtogs">${tog("verify_pronunciation", "Listen back for names", "After a voice-over is recorded, speech recognition checks the game names. Recognition can mishear correct fictional names, so results are only suggestions.")}</div>
    <details style="margin-top:10px"><summary class="small">Quality check thresholds</summary>${viQC(s.qc || {})}</details>
    <h2 style="margin-top:24px">When scanning finds new names</h2>
    <select style="width:auto" onchange="viSet({auto_save:this.value})">${[["save", "Save them, marked for review"], ["confident", "Save only confident ones"], ["review", "Don't save: show them to me first"]].map(([k, l]) => `<option value="${k}" ${s.auto_save === k ? "selected" : ""}>${l}</option>`).join("")}</select>
    <div class="small faint" style="margin-top:12px">What each voice can do: Qwen3-TTS (natural): moods via a reference per mood, pronunciation by respelling, speed by time-stretch. Kokoro (fast): IPA pronunciation and native speed, no moods. Neither takes SSML or inline emotion tags, so SPHURA never sends them.</div>`;
}
const VI_QC = { identity_min: ["Same-speaker similarity below", 0.3, 0.95, 0.01], timbre_max: ["Voice colour spread above", 1, 4, 0.1], pitch_shift_st: ["Pitch shift above (semitones)", 1, 8, 0.5],
  loudness_spread_lu: ["Loudness spread above (LU)", 1, 10, 0.5], rate_change: ["Pace change above", 0.1, 0.8, 0.05], boundary_jump_db: ["Level jump at joins above (dB)", 2, 15, 0.5], long_pause_ms: ["Pause longer than (ms)", 500, 4000, 100] };
function viQC(qc) {
  const d = VI.qa?.qc_defaults || {};
  return `<div class="small faint" style="margin:6px 0">Each check flags a segment for you to listen to. Nothing is rejected or regenerated automatically.</div>
    <div class="vsls">${Object.entries(VI_QC).map(([k, [l, min, max, step]]) => `<label class="vsl"><span>${l}</span><input type="number" min="${min}" max="${max}" step="${step}" value="${qc[k] ?? d[k] ?? ""}" style="grid-column:1/-1" onchange="viSet({qc:{...VI.data.settings.qc, ${k}: +this.value}})"></label>`).join("")}</div>
    <button class="ghost small" style="margin-top:8px" onclick="viSet({qc:{}}).then(viStyle)">Reset to defaults</button>`;
}
function viShow(k, v) { return k === "intensity" || k === "transition_sensitivity" ? Math.round(v * 100) + "%" : (+v).toFixed(k === "speed" ? 2 : 1) + "×"; }
async function viSet(patch) {
  try { VI.data.settings = await api("/v1/voice/intel/settings", { method: "PUT", body: patch }); if ("personality" in patch || "custom" in patch) viStyle(); } catch (e) { toast(e.message); }
}
async function viProfile(patch) { try { await api(`/v1/voice/intel/${VI.game}`, { method: "PUT", body: patch }); VI.game_data.profile = { ...VI.game_data.profile, ...patch }; toast("Saved"); } catch (e) { toast(e.message); } }

// Preview & test
function viTest() {
  const names = VI.game_data?.terms.filter(t => t.kind === "character").slice(0, 2).map(t => t.canonical) || [];
  const sample = names.length >= 2 ? `[tense, slow] Something was wrong here... and ${names[0]} knew it. [reflective] For the first time, ${names[1]} wasn't sure.` : "[tense, slow] Something was wrong here... and he knew it. [reflective] For the first time, nobody was sure.";
  const P = VI.data.personalities, moods = VI.data.moods;
  const voices = (VO.status?.voices || []).map(v => `<option value="${v.id}" ${v.id === viVoice() ? "selected" : ""}>${esc(v.label)}${v.ready ? "" : " (not installed)"}</option>`).join("");
  const pers = sel => `<option value="">Current setting</option>` + P.map(p => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  $("#vibody").innerHTML = `<div class="vtest">
    <div class="card"><h2>Preview a line</h2>
      <textarea id="vitext" rows="4" style="width:100%">${esc(VI._text || sample)}</textarea>
      <div class="small faint" style="margin:4px 0 10px">Delivery notes in [brackets] are never read aloud: [tense, slow], [short pause, reflective], [excited]…</div>
      <div class="row"><label class="small">Voice <select id="vivoice" style="width:auto" onchange="localStorage.setItem('cf_voice',this.value)">${voices}</select></label>
        <label class="small">Mood <select id="vimood" style="width:auto"><option value="">From [brackets]</option>${moods.map(m => `<option>${m}</option>`).join("")}</select></label></div>
      <div class="row" style="margin-top:10px">
        <label class="small">A <select id="vipa" style="width:auto">${pers("")}</select></label><button onclick="viPreview(this,'a')">${ic("play")} Play A</button>
        <label class="small" style="margin-left:12px">B <select id="vipb" style="width:auto">${pers("dark")}</select></label><button onclick="viPreview(this,'b')">${ic("play")} Play B</button>
        <span class="grow"></span><button class="ghost small" onclick="viPreview(this,'a',true)" title="Say it again with a fresh take">${ic("refresh")} New take</button>
        <button class="small" onclick="viQA(this)" title="Generate with A, then measure it and listen back for the names">${ic("check")} Check quality</button></div>
      <div id="viplan" style="margin-top:12px"></div><div id="viqa"></div></div>
    <div class="card"><h2>Test a name</h2>
      <div class="small muted" style="margin-bottom:8px">Try two ways of spelling how it's said, then keep the one that sounds right.</div>
      <label class="small muted">Name</label><input type="text" id="vin" style="width:100%" placeholder="Hræsvelgr">
      <div class="row" style="margin-top:8px"><input type="text" id="via" class="grow" placeholder="Spelling A, e.g. Rice-vel-gur"><button onclick="viAB(this,'a')">${ic("play")} A</button><button class="small" onclick="viKeep('a')">Use A</button></div>
      <div class="row" style="margin-top:6px"><input type="text" id="vib" class="grow" placeholder="Spelling B, e.g. Hray-svel-gur"><button onclick="viAB(this,'b')">${ic("play")} B</button><button class="small" onclick="viKeep('b')">Use B</button></div></div></div>`;
  viPlanShow();
}
function viBody(which, fresh) {
  const text = $("#vitext").value; VI._text = text;
  const mood = $("#vimood").value, pers = $(which === "b" ? "#vipb" : "#vipa").value;
  return { voice: $("#vivoice").value, game: VI.game, text, direction: mood ? { mood } : null, personality: pers || null, take: fresh ? Date.now() % 100000 : null };
}
async function viPreview(btn, which, fresh) {
  const body = viBody(which, fresh);
  if (!voReady(body.voice)) { toast("Install this voice first (Shorts → Voice-over)"); return; }
  viPlanShow(body); viPlay(btn, body);
}
async function viPlanShow(body) {
  body = body || viBody("a"); const el = $("#viplan"); if (!el) return;
  try {
    const p = await api("/v1/voice/plan", { method: "POST", body });
    el.innerHTML = `<details><summary>What the voice reads <span class="faint">· ${esc(p.mood)} · ${p.speed}× · ${esc(p.personality || "")}</span></summary>
      <div class="small" style="margin-top:8px">${p.segments.map(s => `<span class="vseg">${esc(s.text)}</span>${s.pause_after_ms ? `<span class="faint"> ⏸ ${(s.pause_after_ms / 1000).toFixed(1)}s </span>` : ""}`).join("")}</div>
      ${p.changes.length ? `<div class="small muted" style="margin-top:6px">Pronunciation: ${p.changes.map(c => `${esc(c.term)} → ${esc(c.said)}`).join(", ")}</div>` : ""}
      ${p.reference ? `<div class="small faint" style="margin-top:4px">Qwen reference: ${esc(p.personality)} · ${esc(p.reference)} delivery</div>` : ""}</details>`;
  } catch (e) { el.innerHTML = `<div class="small err">${esc(e.message)}</div>`; }
}
function viAB(btn, which) {
  const name = $("#vin").value.trim(), sp = $("#vi" + which).value.trim(), voice = $("#vivoice").value;
  if (!name || !sp) { toast("Enter the name and a spelling"); return; }
  if (!voReady(voice)) { toast("Install this voice first"); return; }
  viPlay(btn, { voice, game: VI.game, text: `${name}. They called it ${name}.`, respell: { [name]: sp } });
}
async function viKeep(which) {
  const name = $("#vin").value.trim(), sp = $("#vi" + which).value.trim(); if (!name || !sp) return;
  const old = VI.game_data.terms.find(t => t.canonical.toLowerCase() === name.toLowerCase());
  try { await api(`/v1/voice/intel/${VI.game}/terms`, { method: "POST", body: { ...(old || {}), id: old?.id || "", canonical: old?.canonical || name, respell: sp } }); toast(`Saved: ${name} → ${sp}`); VI.game_data = await api(`/v1/voice/intel/${VI.game}`); }
  catch (e) { toast(e.message); }
}

// ---------- Start ----------
(async () => {
  loadStatus(); setTheme(document.documentElement.dataset.theme);
  const ps = await loadProjects().catch(() => []);
  if (location.hash === "#music") showMusic();
  else if (location.hash === "#reels") showReels();
  else if (location.hash === "#lore") showLore();
  else if (location.hash === "#voice") showVoice();
  else if (location.hash.startsWith("#intel")) showIntel(location.hash.split("/")[1] || "overview");
  else if (location.hash.startsWith("#reel/")) openReel(location.hash.slice(6));
  else if (location.hash.startsWith("#edit/")) openEditor(location.hash.slice(6));
  else if (location.hash.startsWith("#downloads")) showDownloads(location.hash === "#downloads/library" ? "library" : "queue");
  else if (ps.length) openProject(ps[0].id); else showNew();
})();
</script>
</body>
