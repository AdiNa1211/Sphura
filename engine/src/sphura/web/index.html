    html = `<h2>Text</h2><textarea rows="2" style="width:100%" oninput="ed.st.overlays[${i}].text=this.value;ed.dirty=true;edDraw();edDrawText(edNow())">${esc(o.text)}</textarea>
      <div class="edrow"><label>Style</label><select onchange="ed.st.overlays[${i}].style=this.value;ed.dirty=true;edDrawText(edNow())">${Object.entries(ED_STYLES).filter(([k]) => k !== "bar" || s.style === "meme" || s.caption_bar).map(([k, l]) => `<option value="${k}" ${k === o.style ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="edrow"><label>Shows</label><input type="number" step="0.1" value="${o.start_s.toFixed(1)}" onchange="edSetTime(${i},'start_s',this.value)"> to <input type="number" step="0.1" value="${o.end_s.toFixed(1)}" onchange="edSetTime(${i},'end_s',this.value)"> s</div>
      <div class="edrow"><label>Size</label><button title="Smaller" onclick="edSize(${i},-0.1)">A−</button>
        <input type="number" min="40" max="300" step="5" style="width:64px" value="${Math.round((o.size || 1) * 100)}" onchange="edSize(${i},null,this.value/100)"> %
        <button title="Bigger" onclick="edSize(${i},0.1)">A+</button></div>
      <div class="edrow"><label></label>${[["S", 0.7], ["M", 1], ["L", 1.4], ["XL", 1.9]].map(([l, v]) =>
        `<button class="${Math.abs((o.size || 1) - v) < 0.01 ? "primary" : ""}" onclick="edSize(${i},null,${v})">${l}</button>`).join("")}</div>
      <div class="edrow"><label></label><input type="range" min="0.4" max="3" step="0.05" value="${o.size || 1}" oninput="edSize(${i},null,+this.value,true)"></div>
      <div class="small muted">Tip: drag the corner handle of the text on the preview, or scroll over it.</div>
      <div class="edrow"><label>Colour</label><input type="color" value="${o.color || "#ffffff"}" oninput="ed.st.overlays[${i}].color=this.value;ed.dirty=true;edDrawText(edNow())">
        <button onclick="ed.st.overlays[${i}].color='';ed.dirty=true;edInspector();edDrawText(edNow())">Default</button></div>
      <div class="edrow"><label>Position</label>${o.style === "bar" ? `<span class="small muted">In the caption bar</span>` : `<span class="small muted">${o.y == null ? "Default" : Math.round(o.y * 100) + "% from top"} · drag it on the preview</span>
        <button onclick="ed.st.overlays[${i}].y=null;ed.dirty=true;edInspector();edDrawText(edNow())">Reset</button>`}</div>
      <div class="row" style="margin-top:10px"><button onclick="edJump(${o.start_s})">Go to</button><div class="grow"></div><button onclick="edDelete()">Delete text</button></div>`;
  } else if (ed.sel?.kind === "seg" && s.segments[ed.sel.i]) {
    const [a, b] = s.segments[ed.sel.i], i = ed.sel.i;

      <div class="edrow"><label>Starts</label><button onclick="edNudge(${i},0,-1)">−1s</button><button onclick="edNudge(${i},0,-0.1)">−0.1</button>
        <input type="number" step="0.1" value="${a.toFixed(1)}" onchange="edSetSeg(${i},0,this.value)"><button onclick="edNudge(${i},0,0.1)">+0.1</button><button onclick="edNudge(${i},0,1)">+1s</button></div>
      <div class="edrow"><label>Ends</label><button onclick="edNudge(${i},1,-1)">−1s</button><button onclick="edNudge(${i},1,-0.1)">−0.1</button>
        <input type="number" step="0.1" value="${b.toFixed(1)}" onchange="edSetSeg(${i},1,this.value)"><button onclick="edNudge(${i},1,0.1)">+0.1</button><button onclick="edNudge(${i},1,1)">+1s</button></div>
      <div class="small muted" style="margin:6px 0">Tip: switch to "Original footage" to see the exact frame you cut on.</div>
      <div class="row"><button onclick="edSplit()">✂ Split at playhead</button><div class="grow"></div><button ${s.segments.length < 2 ? "disabled" : ""} onclick="edDelete()">Delete part</button></div>`;
  } else html = `<h2>Edit</h2><div class="small muted">Click a part or a text block in the timeline to edit it, or add text at the playhead.</div>`;
  if (s.style !== "meme") html += `<h2 style="margin-top:18px">Layout</h2>
    <label class="small" style="display:block"><input type="checkbox" ${s.caption_bar ? "checked" : ""} onchange="ed.st.caption_bar=this.checked;ed.dirty=ed.dirtyBar=true;edInspector()"> White caption bar on top (meme-style)</label>

  html += `<h2 style="margin-top:18px">Effects</h2><div class="small" style="margin-bottom:6px">${esc(s.fx_label || "")}</div>
    ${s.toggles.map(k => `<label class="small" style="display:block"><input type="checkbox" ${s.fx_off.includes(k) ? "" : "checked"} onchange="edFx('${k}',this.checked)"> ${FX_NAMES[k] || k}</label>`).join("")}
    ${s.music ? `<div class="small muted" style="margin-top:8px">♪ ${esc(s.music)} (change it on the Shorts page)</div>` : ""}

  el.innerHTML = html;
}
function edJump(t) { if (ed.orig) { document.querySelector('input[value=short]').click(); } $("#edvid").currentTime = t + 0.05; setTimeout(edTick, 60); }
function edSetTime(i, k, v) { const o = ed.st.overlays[i]; o[k] = Math.max(0, +v); if (o.end_s <= o.start_s) o.end_s = o.start_s + 0.5; ed.dirty = true; edDraw(); edDrawText(edNow()); }

async function edRender(kind, quiet) {
  if (ed.busy) return; ed.busy = true;
  const st = $("#edstatus"); st.innerHTML = `<span class="spin"></span> ${kind === "draft" ? "Rendering preview…" : "Saving and exporting…"}`;
  try {
    const body = { render: kind };
    if (!quiet) { body.segments = ed.st.segments; body.overlays = ed.st.overlays; body.fx_off = ed.st.fx_off; body.caption_bar = ed.st.caption_bar; }
    const r = await api(`/v1/clips/${ed.st.id}/editor`, { method: "PUT", body });
    for (;;) {
      await new Promise(res => setTimeout(res, 1000));
      const j = await api(`/v1/jobs/${r.job_id}`);
      if (!$("#edstatus")) return;
      st.innerHTML = `<span class="spin"></span> ${kind === "draft" ? "Rendering preview" : "Exporting"} ${Math.round((j.progress || 0) * 100)}%`;
      if (j.status === "succeeded") break;
      if (j.status === "failed" || j.status === "cancelled") throw new Error(j.error || "render failed");
    }
    const keepSel = ed.sel, t = edNow();
    ed.st = await api(`/v1/clips/${ed.st.id}/editor`); ed.dirty = ed.dirtyCuts = ed.dirtyFx = ed.dirtyBar = false; ed.sel = keepSel;
    if (kind === "final") toast("Saved and exported");
    renderEditor();
    $("#edstatus").textContent = kind === "draft" ? "Preview updated" : "Saved and exported to your Shorts folder";
    const v = $("#edvid"); v.onloadeddata = () => { v.currentTime = Math.min(t, ed.st.duration); edTick(); };
  } catch (e) { st.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  finally { ed.busy = false; }
}
document.addEventListener("keydown", e => {
  if (!ed || !$("#edtl") || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); edPlay(); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); edDelete(); }
  else if (e.key === "s" || e.key === "S") edSplit();
});

// ---------- Start ----------
(async () => {
  loadStatus();
  const ps = await loadProjects().catch(() => []);
  if (location.hash === "#music") showMusic();
  else if (location.hash.startsWith("#edit/")) openEditor(location.hash.slice(6));
  else if (location.hash.startsWith("#downloads")) showDownloads(location.hash === "#downloads/library" ? "library" : "queue");
  else if (ps.length) openProject(ps[0].id); else showNew();
})();
</script>
</body>
